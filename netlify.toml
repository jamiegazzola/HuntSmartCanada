# HuntSmart GitHub-backed production deployment
[build]
  # Build the core app, publish the map-guide controller, inject analytics/admin
  # intelligence, then add crawlable SEO/AEO and research layers. The species
  # LEH explorer runs late so generic generators cannot overwrite Elk/Moose pages.
  # The trust layer runs after content generation; homepage cleanup keeps those
  # research-only trust links off the consumer homepage; IndexNow runs last.
  command = "bash build-preview.sh && cat hunt-detail-premium.js hunt-detail-chrome-fix.js >> site/bc-detail.js && cat gos-premium-toolbar.js gos-toolbar-row-final.js map-ui-polish.js >> site/bc-open-seasons.js && cat mobile-map-polish.css >> site/terrain-intelligence.css && cat mobile-map-topbar-fix.css >> site/terrain-intelligence.css && cat map-premium-shell.js map-ui-polish.js >> site/terrain-intelligence.js && cat mobile-map-shell-finalizer.js >> site/terrain-intelligence.js && cat mobile-map-touch-targets.js >> site/terrain-intelligence.js && cat map-zone-selection-fix.js >> site/terrain-intelligence.js && cp blog-map-guide-controller.js site/blog-map-guide-controller.js && python3 -c \"from pathlib import Path; ps=[Path('site/how-to-use-huntsmart-map.html'),Path('site/blog/how-to-use-huntsmart-map/index.html')]; [p.write_text(p.read_text(encoding='utf-8').replace('./blog-map-guide-controller.js','/blog-map-guide-controller.js'),encoding='utf-8') for p in ps]\" && bash build-analytics.sh && python3 build-seo-aeo.py && python3 build-search-growth.py && python3 build-interactive-research.py && python3 build-dark-research-cards.py && python3 build-species-leh-research-v2.py && python3 fix-species-leh-chart.py && python3 build-trust-layer.py && python3 build-homepage-cleanup.py && python3 build-indexnow.py"
  publish = "site"
  # Netlify skips the build when this command exits 0. Ignore CI/docs-only commits;
  # every app, data, build, SEO, or research change still receives a deploy.
  ignore = "git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ':(exclude).github/**' ':(exclude)README.md' ':(exclude).DS_Store' ':(exclude)REVERT_MARKER.tmp' ':(exclude)STOP' ':(exclude)TEMP_DO_NOT_USE' ':(exclude)noop.txt'"

[build.environment]
  # Firebase web API keys are intentionally shipped to the browser. Disable
  # only Netlify's heuristic \"likely secret\" detection; normal env-var secret
  # scanning remains enabled.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self)"

[[headers]]
  for = "/4b8e6f1d92c740fca361b5e897d2a48c.txt"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
