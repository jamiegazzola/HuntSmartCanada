*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden}html,body{height:100%;height:100dvh}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111714;color:#fff;overscroll-behavior:none}#map{position:absolute;inset:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.glass{background:rgba(14,20,17,.9);border:1px solid rgba(255,255,255,.14);box-shadow:0 7px 24px rgba(0,0,0,.24);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}button,select,input{font:inherit}.controls{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;display:flex;gap:8px;align-items:center}.species-wrap{position:relative;width:min(320px,48vw)}.species-wrap:after{content:"⌄";position:absolute;right:14px;top:50%;transform:translateY(-57%);font-size:18px;pointer-events:none}.species{width:100%;height:46px;border:0;border-radius:14px;padding:0 40px 0 14px;background:#111714;color:#fff;font-weight:760;appearance:none;-webkit-appearance:none;outline:1px solid rgba(255,255,255,.15)}.period{display:flex;height:46px;padding:4px;border-radius:14px}.period button{border:0;background:transparent;color:#aeb8b2;font-weight:780;padding:0 14px;border-radius:10px;cursor:pointer}.period button.active{background:#fff;color:#101512}.opacity{position:absolute;z-index:6;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);width:min(360px,45vw);height:42px;border-radius:14px;padding:0 14px;display:flex;align-items:center}.opacity input{width:100%;accent-color:#fff}.map-btn{position:absolute;z-index:7;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:48px;height:48px;border:0;border-radius:14px;color:#fff;font-size:13px;font-weight:850;cursor:pointer}.map-btn.active{background:#fff;color:#101512}.pin-card{position:absolute;z-index:8;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);transform:translate(-50%,8px);width:min(420px,calc(100% - 28px));display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-radius:14px;opacity:0;pointer-events:none;transition:.14s ease}.pin-card.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}.coord{flex:1;min-width:0;font-size:13px;font-weight:760;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.copy{height:38px;border:0;border-radius:10px;background:#fff;color:#111714;font-weight:850;padding:0 14px;cursor:pointer}.toast,.loading{position:absolute;z-index:9;left:50%;transform:translateX(-50%);padding:7px 10px;border-radius:10px;font-size:12px;font-weight:760;opacity:0;pointer-events:none;transition:.14s ease}.toast{bottom:calc(env(safe-area-inset-bottom,0px) + 124px)}.loading{top:calc(env(safe-area-inset-top,0px) + 68px)}.toast.show,.loading.show{opacity:1}.error{position:absolute;z-index:20;inset:0;display:none;place-items:center;background:#111714;padding:28px;text-align:center}.error.show{display:grid}.error strong{display:block;font-size:19px;margin-bottom:8px}.error span{font-size:13px;color:#c8d0cb;line-height:1.45}@media(max-width:720px){.controls{left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);display:grid;grid-template-columns:minmax(0,1fr) auto}.species-wrap{width:auto}.species{height:44px;border-radius:13px}.period{height:44px;border-radius:13px}.period button{padding:0 10px;font-size:12px}.opacity{left:12px;transform:none;width:calc(100% - 82px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);height:40px}.map-btn{right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:48px;height:48px}.pin-card{bottom:calc(env(safe-area-inset-bottom,0px) + 66px)}.loading{top:calc(env(safe-area-inset-top,0px) + 62px)}}
</style></head><body><div id="map" aria-label="British Columbia species map"></div><div class="controls"><div class="species-wrap"><select id="species" class="species glass" aria-label="Species"></select></div><div class="period glass" role="group" aria-label="Layer period"><button id="modern" class="active" type="button">Modern</button><button id="historic" type="button">Historic</button></div></div><div class="opacity glass"><input id="opacity" type="range" min="20" max="90" step="5" value="70" aria-label="Overlay opacity"></div><button id="tilt" class="map-btn glass" type="button" aria-label="Toggle 3D map">3D</button><div id="pin-card" class="pin-card glass"><div id="coord" class="coord"></div><button id="copy" class="copy" type="button">Copy</button></div><div id="toast" class="toast glass" role="status" aria-live="polite"></div><div id="loading" class="loading glass">Loading…</div><div id="error" class="error"><div><strong>Map couldn’t load</strong><span id="error-text">Reload the page and try again.</span></div></div>
