<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111714"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="BC Species Map"><meta name="robots" content="noindex,nofollow,noarchive"><title>BC Species Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111714;overscroll-behavior:none}#map{position:absolute;inset:0;touch-action:none}.pick{position:absolute;z-index:1000;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);width:min(300px,calc(100% - 28px))}.pick select{width:100%;min-height:48px;border:1px solid #ffffff42;border-radius:14px;padding:0 42px 0 16px;font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7faf8;background:#111714f0;box-shadow:0 6px 18px #0000003d;-webkit-appearance:none;appearance:none;outline:none}.pick:after{content:"⌄";position:absolute;right:16px;top:50%;transform:translateY(-58%);color:#fff;font-size:21px;pointer-events:none}.leaflet-control-attribution{font-size:9px;opacity:.72}.leaflet-container{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.copy-toast{position:absolute;z-index:1100;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translate(-50%,10px);max-width:calc(100% - 28px);padding:10px 14px;border-radius:12px;background:#111714ef;color:#fff;font-size:14px;font-weight:700;box-shadow:0 6px 18px #0006;opacity:0;pointer-events:none;transition:.18s ease;text-align:center}.copy-toast.show{opacity:1;transform:translate(-50%,0)}.leaflet-marker-icon{touch-action:none}.leaflet-tooltip.pin-tip{border:0;border-radius:9px;background:#111714ee;color:#fff;box-shadow:0 3px 10px #0005;font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:6px 8px}.leaflet-tooltip.pin-tip:before{display:none}@media(max-width:360px){.pick{width:calc(100% - 24px);top:calc(env(safe-area-inset-top,0px) + 10px)}}</style></head><body><div id="map" aria-label="British Columbia species distribution map"></div><label class="pick"><select id="species" aria-label="Select species"><option value="elk">Elk</option><option value="moose">Moose</option><option value="mule_deer">Mule Deer</option><option value="white_tailed_deer">White-tailed Deer</option><option value="mountain_goat">Mountain Goat</option><option value="wild_sheep">Wild Sheep</option><option value="caribou">Caribou</option></select></label><div id="toast" class="copy-toast" role="status" aria-live="polite"></div><script src="hires-elk.js"></script><script src="hires-moose.js"></script><script src="hires-mule-deer.js"></script><script src="data/white_tailed_deer-hires.js"></script><script src="hires-b.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const DATA=window.SPECIES_GZ||{},RAW=window.SPECIES_DATA||{},PALETTE=[[0,0,0,0],[63,150,70,155],[244,208,63,170],[244,139,39,183],[215,48,39,198]],BOUNDS=[[48.1,-139.2],[60.1,-113.8]],W=650,H=307;
const map=L.map('map',{zoomControl:false,minZoom:4,maxZoom:16,maxBounds:[[45.5,-143.5],[62.4,-109.5]],maxBoundsViscosity:.65,preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
let overlay=null,renderToken=0;const imageCache={};
async function gunzipBase64(b64){if(!('DecompressionStream' in window))throw new Error('A newer Safari/iOS version is required');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(stream).text()}
function rleToImage(rle){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{alpha:true}),img=x.createImageData(W,H),a=img.data;let i=0;for(const token of rle.split(',')){if(!token)continue;const k=Number(token[0]),n=parseInt(token.slice(1),36),p=PALETTE[k];for(let j=0;j<n&&i<W*H;j++,i++){const z=i*4;a[z]=p[0];a[z+1]=p[1];a[z+2]=p[2];a[z+3]=p[3]}}x.putImageData(img,0,0);return c.toDataURL('image/png')}
async function imageFor(key){if(imageCache[key])return imageCache[key];let rle=RAW[key]||'';if(DATA[key])rle=await gunzipBase64(DATA[key]);if(!rle)throw new Error('Species layer missing');const url=rleToImage(rle);imageCache[key]=url;return url}
const toast=document.getElementById('toast');let toastTimer;function showToast(text,ms=1500){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),ms)}
async function showSpecies(key){const token=++renderToken;try{const url=await imageFor(key);if(token!==renderToken)return;if(overlay)map.removeLayer(overlay);overlay=L.imageOverlay(url,BOUNDS,{opacity:1,interactive:false,zIndex:400}).addTo(map)}catch(err){showToast(err.message||'Unable to load layer')}}
const select=document.getElementById('species');select.addEventListener('change',e=>showSpecies(e.target.value));map.fitBounds(BOUNDS);showSpecies(select.value);
setTimeout(()=>{for(const key of new Set([...Object.keys(DATA),...Object.keys(RAW)])){if(key!==select.value)imageFor(key).catch(()=>{})}},1200);
async function copyText(text){try{await navigator.clipboard.writeText(text);return true}catch(_){try{const t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();return ok}catch(__){return false}}}
function coordText(ll){return `${ll.lat.toFixed(6)}, ${ll.lng.toFixed(6)}`}
let pin=null,pinExpiryTimer=null,pinCountdownTimer=null,pinExpiresAt=0;
function clearPinTimers(){clearTimeout(pinExpiryTimer);clearInterval(pinCountdownTimer);pinExpiryTimer=null;pinCountdownTimer=null}
function removePin(){clearPinTimers();if(pin){map.removeLayer(pin);pin=null}}
function updatePinTooltip(){if(!pin)return;const remaining=Math.max(0,Math.ceil((pinExpiresAt-Date.now())/1000));pin.setTooltipContent(`${coordText(pin.getLatLng())}<br>Drag to adjust · ${remaining}s`)}
function armPinExpiry(){clearPinTimers();pinExpiresAt=Date.now()+60000;updatePinTooltip();pinCountdownTimer=setInterval(updatePinTooltip,1000);pinExpiryTimer=setTimeout(()=>{removePin();showToast('Pin expired')},60000)}
async function copyPinCoords(prefix='Copied'){if(!pin)return;const text=coordText(pin.getLatLng()),ok=await copyText(text);showToast(ok?`${prefix} ${text}`:text,1800)}
async function placePin(ll){if(pin){pin.setLatLng(ll)}else{pin=L.marker(ll,{draggable:true,autoPan:true,riseOnHover:true}).addTo(map).bindTooltip('',{permanent:true,direction:'top',offset:[0,-30],className:'pin-tip'}).openTooltip();pin.on('dragstart',()=>{clearPinTimers();showToast('Adjust pin, then release')});pin.on('drag',updatePinTooltip);pin.on('dragend',async()=>{armPinExpiry();await copyPinCoords('Copied')})}armPinExpiry();if(navigator.vibrate)navigator.vibrate(35);await copyPinCoords('Pinned')}
const mapEl=document.getElementById('map');let holdTimer=null,startX=0,startY=0,pointerId=null;function clearHold(){if(holdTimer){clearTimeout(holdTimer);holdTimer=null}}
mapEl.addEventListener('contextmenu',e=>e.preventDefault());
mapEl.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('.leaflet-marker-icon'))return;if(e.pointerType==='mouse'&&e.button!==0)return;pointerId=e.pointerId;startX=e.clientX;startY=e.clientY;clearHold();holdTimer=setTimeout(async()=>{holdTimer=null;const r=mapEl.getBoundingClientRect(),ll=map.containerPointToLatLng(L.point(startX-r.left,startY-r.top));await placePin(ll)},650)},{passive:true});
mapEl.addEventListener('pointermove',e=>{if(e.pointerId!==pointerId)return;if(Math.hypot(e.clientX-startX,e.clientY-startY)>10)clearHold()},{passive:true});
for(const type of ['pointerup','pointercancel'])mapEl.addEventListener(type,e=>{if(e.pointerId===pointerId){clearHold();pointerId=null}},{passive:true});
mapEl.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')clearHold()},{passive:true});
</script></body></html>
