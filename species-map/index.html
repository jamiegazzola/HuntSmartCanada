<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="theme-color" content="#111714"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="BC Species Map"><meta name="robots" content="noindex,nofollow,noarchive"><title>BC Species Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111714}#map{position:absolute;inset:0}.pick{position:absolute;z-index:1000;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);width:min(300px,calc(100% - 28px))}.pick select{width:100%;min-height:48px;border:1px solid #ffffff42;border-radius:14px;padding:0 42px 0 16px;font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7faf8;background:#111714f0;box-shadow:0 6px 18px #0000003d;-webkit-appearance:none;appearance:none;outline:none}.pick:after{content:"⌄";position:absolute;right:16px;top:50%;transform:translateY(-58%);color:#fff;font-size:21px;pointer-events:none}.leaflet-control-attribution{font-size:9px;opacity:.72}@media(max-width:360px){.pick{width:calc(100% - 24px);top:calc(env(safe-area-inset-top,0px) + 10px)}}</style></head><body><div id="map" aria-label="British Columbia species distribution map"></div><label class="pick"><select id="species" aria-label="Select species"><option value="elk">Elk</option><option value="moose">Moose</option><option value="mule_deer">Mule Deer</option><option value="white_tailed_deer">White-tailed Deer</option><option value="mountain_goat">Mountain Goat</option><option value="wild_sheep">Wild Sheep</option><option value="caribou">Caribou</option></select></label><script>window.SPECIES_DATA={}</script><script src="data/elk.js"></script><script src="data/moose.js"></script><script src="data/mule_deer.js"></script><script src="data/white_tailed_deer.js"></script><script src="data/mountain_goat.js"></script><script src="data/wild_sheep.js"></script><script src="data/caribou.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const D=window.SPECIES_DATA,P=[[0,0,0,0],[63,150,70,155],[244,208,63,170],[244,139,39,183],[215,48,39,198]],B=[[48.1,-139.2],[60.1,-113.8]],m=L.map('map',{zoomControl:false,minZoom:4,maxZoom:15,maxBounds:[[45.5,-143.5],[62.4,-109.5]],maxBoundsViscosity:.65});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(m);let o;function img(s){const c=document.createElement('canvas');c.width=260;c.height=123;const x=c.getContext('2d'),q=x.createImageData(260,123),a=q.data;let i=0;for(const t of s.split(',')){const k=+t[0],n=parseInt(t.slice(1),36),p=P[k];for(let j=0;j<n;j++,i++){const z=i*4;a[z]=p[0];a[z+1]=p[1];a[z+2]=p[2];a[z+3]=p[3]}}x.putImageData(q,0,0);return c.toDataURL()}const cache={};function show(k){if(o)m.removeLayer(o);cache[k]??=img(D[k]);o=L.imageOverlay(cache[k],B,{opacity:1,interactive:false,zIndex:400}).addTo(m)}const s=document.getElementById('species');s.addEventListener('change',e=>show(e.target.value));m.fitBounds(B);show(s.value);</script></body></html>
