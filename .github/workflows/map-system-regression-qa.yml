name: HuntSmart Map System Regression QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - map-ui-polish.js
      - gos-premium-toolbar.js
      - gos-toolbar-row-final.js
      - map-premium-shell.js
      - map-zone-selection-fix.js
      - mobile-map-shell-finalizer.js
      - mobile-map-touch-targets.js
      - mobile-map-polish.css
      - mobile-map-topbar-fix.css
      - mobile-pwa-shell.css
      - mobile-pwa-shell.js
      - imagery-lab.js
      - terrain-intelligence.js
      - terrain-intelligence.css
      - bc-open-seasons.js
      - maps.js
      - index.html
      - build-preview.sh
      - build-pwa-shell.py
      - netlify.toml
      - .github/workflows/map-system-regression-qa.yml

permissions:
  contents: read

jobs:
  map-system-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate map-controller and mobile-shell invariants
        run: |
          node --check imagery-lab.js
          node --check mobile-map-shell-finalizer.js
          node --check mobile-pwa-shell.js
          python3 -m py_compile build-pwa-shell.py
          node <<'NODE'
          const fs = require('fs');
          const assert = (v,m) => { if (!v) throw new Error(m); };
          const read = p => fs.readFileSync(p,'utf8');

          const controller = read('imagery-lab.js');
          for (const marker of [
            'function ensureShells',
            'function openInteractive',
            'function switchMode',
            'function switchProvince',
            'selectGOSRegion: setGOSRegion',
            'activeGOSWMUs:',
            '__HUNTSMART_INTERACTIVE_MAP__'
          ]) assert(controller.includes(marker), `map controller missing ${marker}`);

          const finalizer = read('mobile-map-shell-finalizer.js');
          for (const marker of [
            'normalizeShellPlacement',
            "root.insertBefore(shell, root.firstChild)",
            "observeSurface('mapPage')",
            "observeSurface('bcOpenSeasonsPage')",
            'hsPremiumMobileLayers',
            'gosPremiumMobileLayers'
          ]) assert(finalizer.includes(marker), `mobile map finalizer missing ${marker}`);

          const pwa = read('mobile-pwa-shell.js');
          for (const marker of [
            'window.visualViewport',
            'hs-mobile-map-active',
            '--hs-map-page-h',
            'scheduleNavigationSync',
            "serviceWorker.register('/hs-offline-lite-sw.js'"
          ]) assert(pwa.includes(marker), `PWA shell missing ${marker}`);

          const css = read('mobile-pwa-shell.css');
          assert(css.includes('var(--hs-visual-vh, 100dvh)'), 'live visual viewport height CSS missing');
          assert(css.includes('safe-area-inset-bottom'), 'bottom safe-area handling missing');
          assert(css.includes('html.hs-standalone'), 'standalone styling missing');

          const build = read('netlify.toml');
          assert(build.includes('mobile-pwa-shell.css'), 'PWA CSS is not included in production build');
          assert(build.includes('mobile-pwa-shell.js'), 'PWA JS is not included in production build');
          assert(build.includes('build-pwa-shell.py'), 'PWA metadata build step missing');

          const sw = read('hs-offline-lite-sw.js');
          assert(sw.includes('networkFirst(request)'), 'service worker is not network-first for app code');
          assert(sw.includes("url.pathname.startsWith('/map-tiles/')"), 'service worker vector-tile cache guard missing');

          console.log('HuntSmart map-system source/build regression checks passed.');
          NODE
