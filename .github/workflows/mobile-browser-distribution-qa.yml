name: HuntSmart Mobile Browser and Distribution QA

on:
  pull_request:
    branches: [main]
    paths:
      - mobile-pwa-shell.css
      - mobile-pwa-shell.js
      - ux-polish.js
      - mobile-account-nav.js
      - map-destinations.js
      - map-vector-runtime.js
      - maps.js
      - bc-filters.js
      - ab-filters.js
      - netlify.toml
      - species-map/hs-map-ui.css
      - species-map/hs-map-ui.js
      - species-map/hs-app-nav.css
      - species-map/hs-app-nav.js
      - scripts/install-species-app-nav.cjs
      - scripts/mobile-browser-preview-qa.cjs
      - scripts/webkit-mobile-ux-qa.cjs
      - .github/workflows/mobile-browser-distribution-qa.yml
  push:
    branches: [main]
    paths:
      - mobile-pwa-shell.css
      - mobile-pwa-shell.js
      - ux-polish.js
      - mobile-account-nav.js
      - map-destinations.js
      - map-vector-runtime.js
      - maps.js
      - bc-filters.js
      - ab-filters.js
      - netlify.toml
      - species-map/hs-map-ui.css
      - species-map/hs-map-ui.js
      - species-map/hs-app-nav.css
      - species-map/hs-app-nav.js
      - scripts/install-species-app-nav.cjs
      - scripts/mobile-browser-preview-qa.cjs
      - scripts/webkit-mobile-ux-qa.cjs

permissions:
  contents: read

jobs:
  responsive-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run exact Netlify site generation for diagnosis
        run: |
          python3 - <<'PY'
          import subprocess, tomllib
          from pathlib import Path
          with Path("netlify.toml").open("rb") as handle:
              command=tomllib.load(handle)["build"]["command"]
          subprocess.run(["bash","-lc",command],check=True)
          assert Path("site/map-destinations.js").is_file() is False, "Map chooser should be bundled, not a separate asset"
          bundle=Path("site/terrain-intelligence.js").read_text()
          assert "__HS_MAP_DESTINATIONS__" in bundle
          assert "hs-mobile-browser" in bundle
          assert Path("site/species-map/hs-map-ui.js").is_file()
          assert 'hs-preview-species-back' in Path('site/species-map/index.html').read_text(), 'Preview species map route missing'
          print("Build succeeded and mobile browser/species distribution integration is present.")
          PY
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          npx playwright install --with-deps webkit
      - name: Static syntax checks
        run: |
          node --check mobile-pwa-shell.js
          node --check ux-polish.js
          node --check mobile-account-nav.js
          node --check map-destinations.js
          node --check map-vector-runtime.js
          node --check maps.js
          node --check bc-filters.js
          node --check ab-filters.js
          node --check species-map/hs-map-ui.js
          node --check species-map/hs-app-nav.js
          node --check scripts/install-species-app-nav.cjs
          grep -q 'hs-app-nav.js' site/species-map/index.html
          grep -q 'hs-app-nav.css' site/species-map/index.html
          node <<'NODE'
          const fs=require('node:fs'),os=require('node:os'),path=require('node:path'),cp=require('node:child_process'),assert=require('node:assert/strict');
          const directory=fs.mkdtempSync(path.join(os.tmpdir(),'hs-private-species-'));
          try {
            fs.writeFileSync(path.join(directory,'index.html'),'<html><head></head><body><div id="map"></div><script src="app.js?v=private"></script></body></html>');
            for (const asset of ['hs-app-nav.css','hs-app-nav.js']) fs.writeFileSync(path.join(directory,asset),'/* fixture */');
            for (let i=0;i<2;i++) cp.execFileSync(process.execPath,['scripts/install-species-app-nav.cjs'],{
              env:{...process.env,HS_SPECIES_NAV_TARGET:directory},stdio:'inherit'
            });
            const html=fs.readFileSync(path.join(directory,'index.html'),'utf8');
            assert.equal((html.match(/hs-app-nav\.css/g)||[]).length,1);
            assert.equal((html.match(/hs-app-nav\.js/g)||[]).length,1);
            assert(html.includes('app.js?v=private'),'Private map viewer app script must be preserved');
            console.log('PASS: private viewer HTML replacement retains exactly one navigation stylesheet and runtime.');
          } finally { fs.rmSync(directory,{recursive:true,force:true}); }
          NODE
          node --check scripts/mobile-browser-preview-qa.cjs
          node --check scripts/webkit-mobile-ux-qa.cjs
          node --check scripts/install-species-preview-route.cjs
      - name: Responsive browser and standalone regression
        env:
          URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--huntsmartcanada.netlify.app', github.event.pull_request.number) || 'https://huntsmartcanada.ca' }}
        run: node scripts/mobile-browser-preview-qa.cjs
      - name: iOS WebKit mobile user-journey regression
        env:
          URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--huntsmartcanada.netlify.app', github.event.pull_request.number) || 'https://huntsmartcanada.ca' }}
        run: node scripts/webkit-mobile-ux-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-browser-distribution-${{ github.run_number }}
          path: mobile-qa-artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
