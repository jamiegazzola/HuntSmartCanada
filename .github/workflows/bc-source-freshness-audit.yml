name: BC Source Freshness Audit

on:
  workflow_dispatch:
  push:
    branches:
      - preview/live-production-github
    paths:
      - 'scripts/audit-bc-source-freshness.mjs'
      - 'draws.json'
      - '.github/workflows/bc-source-freshness-audit.yml'

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run source freshness audit
        run: node scripts/audit-bc-source-freshness.mjs draws.json bc-source-freshness-report.json

      - name: Upload source freshness report
        uses: actions/upload-artifact@v4
        with:
          name: bc-source-freshness-report
          path: bc-source-freshness-report.json
          retention-days: 14
