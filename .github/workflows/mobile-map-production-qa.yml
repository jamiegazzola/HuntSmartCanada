name: HuntSmart Mobile Map Production QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mobile-map-polish.css
      - terrain-intelligence.css
      - imagery-lab.js
      - terrain-intelligence.js
      - maps.js
      - bc-open-seasons.js
      - index.html
      - ux-polish.js
      - build-preview.sh
      - netlify.toml
      - .github/workflows/mobile-map-production-qa.yml

permissions:
  contents: read

jobs:
  mobile-map-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate live mobile map controls
        env:
          URL: https://huntsmartcanada.ca/
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = (value, message) => { if (!value) throw new Error(message); };

          async function openLive(page) {
            let lastError;
            for (let i = 0; i < 12; i++) {
              try {
                await page.goto(`${process.env.URL}?mobile-map-qa=${Date.now()}-${i}`, { waitUntil:'commit', timeout:30000 });
                await page.waitForFunction(() => !!window.__HUNTSMART_INTERACTIVE_MAP__ && typeof window.showPage === 'function', null, { timeout:30000 });
                return;
              } catch (error) {
                lastError = error;
                await page.waitForTimeout(2500);
              }
            }
            throw lastError || new Error('Could not load live mobile map.');
          }

          async function enterMap(page) {
            await page.evaluate(() => window.showPage('map'));
            await page.waitForFunction(() => {
              const map = document.getElementById('mapPage');
              const home = document.getElementById('homePage');
              return !!(map && map.getClientRects().length && getComputedStyle(map).display !== 'none' && (!home || getComputedStyle(home).display === 'none'));
            }, null, { timeout:30000 });
            await page.evaluate(() => window.__HUNTSMART_INTERACTIVE_MAP__.open('leh', { province:'BC' }));
            await page.waitForFunction(() => typeof fullMapInstance !== 'undefined' && !!fullMapInstance, null, { timeout:30000 });
            await page.evaluate(() => { try { fullMapInstance.resize(); } catch (_) {} });
            await page.waitForTimeout(1000);
          }

          function mobileSnapshot(surface) {
            const visible = el => !!(el && el.getClientRects().length && getComputedStyle(el).display !== 'none' && getComputedStyle(el).visibility !== 'hidden');
            const root = surface === 'leh' ? document.getElementById('mapPage') : document.getElementById('bcOpenSeasonsPage');
            const shell = root && root.querySelector(':scope > .hs-im-shellbar');
            const cluster = document.getElementById(surface === 'leh' ? 'hsBrCluster' : 'gosBrCluster');
            const legacy = document.getElementById(surface === 'leh' ? 'fullMapControlStack' : 'osMapControlStack');
            const rail = root && root.querySelector('.hs-rail');
            const duplicateLeh = surface === 'leh' ? document.getElementById('hsRbLEH') : null;
            const zoomGroup = cluster && cluster.querySelector('.hs-zoom-grp');
            const navButtons = cluster ? Array.from(cluster.querySelectorAll('.hs-bb')).filter(visible) : [];
            const shellButtons = shell ? Array.from(shell.querySelectorAll('button')).filter(visible) : [];
            const railButtons = rail ? Array.from(rail.querySelectorAll('.hs-rb')).filter(visible) : [];
            const rect = el => {
              if (!el) return null;
              const r = el.getBoundingClientRect();
              const cs = getComputedStyle(el);
              return { left:r.left, right:r.right, top:r.top, bottom:r.bottom, width:r.width, height:r.height, display:cs.display, position:cs.position };
            };
            const style = el => {
              if (!el) return null;
              const cs = getComputedStyle(el);
              return { display:cs.display, background:cs.backgroundColor, borderTop:cs.borderTopWidth, borderRight:cs.borderRightWidth, borderBottom:cs.borderBottomWidth, borderLeft:cs.borderLeftWidth, boxShadow:cs.boxShadow };
            };
            const mode = key => shell && shell.querySelector(`[data-hs-im-mode="${key}"]`);
            return {
              viewport:{width:innerWidth,height:innerHeight},
              root:rect(root),
              shell:rect(shell),
              shellButtons:shellButtons.map(rect),
              lehAfter: mode('leh') ? getComputedStyle(mode('leh'),'::after').content : '',
              gosAfter: mode('gos') ? getComputedStyle(mode('gos'),'::after').content : '',
              rail:rect(rail),
              railButtons:railButtons.map(rect),
              duplicateLehVisible:visible(duplicateLeh),
              legacyVisible:visible(legacy),
              cluster:rect(cluster),
              zoomGroupStyle:style(zoomGroup),
              navButtons:navButtons.map(rect)
            };
          }

          function assertMobile(surface, snap) {
            assert(snap.root && snap.root.width > 300 && snap.root.height > 400, `${surface} map surface is not occupying the phone viewport: `+JSON.stringify(snap.root));
            assert(snap.shell && snap.shell.left >= 4 && snap.shell.right <= snap.viewport.width - 4 && snap.shell.width > 250, `${surface} top selector overflows or collapsed: `+JSON.stringify(snap.shell));
            assert(snap.shellButtons.length >= 5 && snap.shellButtons.every(button => button.height >= 44), `${surface} top touch targets are undersized: `+JSON.stringify(snap.shellButtons));
            assert(/LEH/.test(snap.lehAfter), `${surface} Limited Entry label was not shortened to LEH: `+snap.lehAfter);
            assert(/GOS/.test(snap.gosAfter), `${surface} General Open Seasons label was not shortened to GOS: `+snap.gosAfter);
            if (surface === 'LEH') assert(!snap.duplicateLehVisible, 'Duplicate LEH rail button is still visible.');
            assert(!snap.legacyVisible, `${surface} legacy connected control stack is still visible on mobile.`);
            if (surface === 'LEH') {
              assert(snap.railButtons.length === 3, 'Mobile utility rail should contain only Layers, Search and Cards: '+JSON.stringify(snap.railButtons));
              assert(snap.railButtons.every(button => button.width >= 44 && button.height >= 44), 'Utility rail touch target is too small: '+JSON.stringify(snap.railButtons));
            }
            assert(snap.navButtons.length === 3, `${surface} should show exactly three + / - / 3D buttons: `+JSON.stringify(snap.navButtons));
            assert(snap.navButtons.every(button => button.width >= 44 && button.height >= 44), `${surface} navigation touch target is too small: `+JSON.stringify(snap.navButtons));
            assert(snap.zoomGroupStyle && snap.zoomGroupStyle.background === 'rgba(0, 0, 0, 0)' && snap.zoomGroupStyle.boxShadow === 'none', `${surface} + / - still have a connecting container: `+JSON.stringify(snap.zoomGroupStyle));
            assert(snap.navButtons[1].top - snap.navButtons[0].bottom >= 4, `${surface} + / - are still visually joined: `+JSON.stringify(snap.navButtons));
            assert(snap.cluster && snap.cluster.right <= snap.viewport.width - 4 && snap.cluster.bottom <= snap.viewport.height - 4, `${surface} floating navigation is clipped: `+JSON.stringify(snap.cluster));
          }

          (async () => {
            const browser = await chromium.launch({ headless:true });
            const page = await browser.newPage({ viewport:{width:390,height:844}, hasTouch:true });
            const errors=[];
            page.on('pageerror', error => errors.push(error.message));

            await openLive(page);
            await enterMap(page);

            const leh = await page.evaluate(mobileSnapshot, 'leh');
            console.log('MOBILE LEH', JSON.stringify(leh));
            await page.screenshot({ path:'mobile-map-leh-390.png', fullPage:false });
            assertMobile('LEH', leh);

            await page.evaluate(() => window.__HUNTSMART_INTERACTIVE_MAP__.switchMode('gos'));
            await page.waitForFunction(() => {
              const target = document.getElementById('bcOpenSeasonsPage');
              return !!(target && target.getClientRects().length && getComputedStyle(target).display !== 'none');
            }, null, { timeout:30000 });
            await page.waitForFunction(() => typeof osMapInstance !== 'undefined' && !!osMapInstance, null, { timeout:30000 });
            await page.evaluate(() => { try { osMapInstance.resize(); } catch (_) {} });
            await page.waitForTimeout(700);

            const gos = await page.evaluate(mobileSnapshot, 'gos');
            console.log('MOBILE GOS', JSON.stringify(gos));
            await page.screenshot({ path:'mobile-map-gos-390.png', fullPage:false });
            assertMobile('GOS', gos);
            assert(!errors.length, 'Page errors: '+errors.join(' | '));

            await browser.close();
            console.log('HuntSmart mobile map production QA passed.');
          })().catch(error => { console.error(error.stack || error); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-map-production-qa-${{ github.run_number }}
          path: mobile-map-*.png
          if-no-files-found: warn
          retention-days: 14
