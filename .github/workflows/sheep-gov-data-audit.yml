name: Audit BC official sheep datasets
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sheep-gov-data-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect official BC harvest and inspection sheet schemas
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from collections import Counter
          from io import BytesIO, StringIO
          import csv, zipfile, xml.etree.ElementTree as ET, json
          urls = {
           'HARVEST': 'https://catalogue.data.gov.bc.ca/dataset/f2303645-5952-4766-bd5c-3b9b50dda1ca/resource/ea1505f6-77ab-4838-b4a9-309ec55a3c20/download/big-game-harvest-statistics-1976-to-2024-wmu.csv',
           'CI': 'https://catalogue.data.gov.bc.ca/dataset/45711667-7878-4d86-8b5e-d0be5997dd16/resource/6fd8fbe1-08a7-4352-8de9-1b0c323e2fb5/download/compulsory-inspection-data-1900-to-2023-24.xlsx',
           'CI_FIELDS': 'https://catalogue.data.gov.bc.ca/dataset/45711667-7878-4d86-8b5e-d0be5997dd16/resource/065a94bd-ffa5-4eef-b771-940f834e5a28/download/field-definitions-compulsory-inspection-data.xlsx'}
          for key,url in urls.items():
           print('START',key,flush=True)
           try:
            with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0 HuntSmartDataAudit/1.0'}),timeout=30) as r:
             blob = r.read(65000000)
             print('HTTP',r.status,'CONTENT_TYPE',r.headers.get('Content-Type'),'LENGTH',len(blob),flush=True)
            if key=='HARVEST':
             reader=csv.DictReader(StringIO(blob.decode('utf-8-sig')))
             print('FIELDS',reader.fieldnames,flush=True)
             counts=Counter()
             examples=[]
             byunit={}
             for row in reader:
              if (row.get('SPECIES') or '').strip()=='SHEE':
               counts[row.get('HUNT YEAR','')]+=1
               try:
                yr=int(row.get('HUNT YEAR') or 0)
                wmu=int(row.get('WMU') or 0)
                if 2015<=yr<=2024 and 0 < wmu%100 < 99 and wmu>=100 and wmu<900:
                 key=f'{wmu//100}-{wmu%100}'
                 def num(name):
                  raw=(row.get(name) or '').strip().replace(',','')
                  return None if not raw else int(float(raw))
                 record=[num('RESIDENT HUNTERS'),num('RESIDENT KILLS'),num('RESIDENT DAYS'),num('NON-RESIDENT HUNTERS'),num('NON-RESIDENT KILLS')]
                 byunit.setdefault(key,{})[yr]=record
               except (ValueError,TypeError):
                pass
               if row.get('HUNT YEAR','')=='2024' and len(examples)<15:
                examples.append(row)
             print('SHEEP_YEARS',counts.most_common(6),flush=True)
             print('SHEEP_2024_ROWS',json.dumps(examples)[:10500],flush=True)
             result={}
             for unit,years in sorted(byunit.items()):
              def pooled(period):
               valid=[r for y,r in years.items() if y>=period and r[0] is not None and r[1] is not None]
               return [sum(r[0] for r in valid),sum(r[1] for r in valid),len(valid)]
              result[unit]={'y':years.get(2024),'p5':pooled(2020),'p10':pooled(2015)}
             print('BC_SHEEP_JSON',json.dumps({'year':2024,'source':'Government of British Columbia','units':result},separators=(',',':')),flush=True)
            else:
             z=zipfile.ZipFile(BytesIO(blob))
             sheets=[n for n in z.namelist() if n.startswith('xl/worksheets/sheet') and n.endswith('.xml')]
             print('WORKSHEETS',sheets[:20],flush=True)
             shared=[]
             if 'xl/sharedStrings.xml' in z.namelist():
              with z.open('xl/sharedStrings.xml') as stream:
               for _,e in ET.iterparse(stream,events=('end',)):
                if e.tag.endswith('}si'):
                 shared.append(''.join(t.text or '' for t in e.iter() if t.tag.endswith('}t')))
                 e.clear()
             for sheet in sheets[:6]:
              rows=[]
              with z.open(sheet) as stream:
               for _,e in ET.iterparse(stream,events=('end',)):
                if not e.tag.endswith('}row'): continue
                vals=[]
                for cell in e:
                 if not cell.tag.endswith('}c'):continue
                 v=next((a for a in cell if a.tag.endswith('}v')),None)
                 if v is None:continue
                 t=v.text or ''
                 if cell.attrib.get('t')=='s':
                  try: t=shared[int(t)]
                  except (ValueError,IndexError): pass
                 vals.append(t)
                e.clear()
                if vals: rows.append(vals[:100])
                if len(rows)>=(70 if key=='CI_FIELDS' else 3):break
              print('SHEET',sheet,'START_ROWS',json.dumps(rows,ensure_ascii=False)[:9500],flush=True)
           except Exception as e:
            print('SOURCE_ERROR',key,type(e).__name__,str(e)[:500],flush=True)
          PY
      - name: Summarize BC compulsory-inspection sheep ages without identifiers
        shell: bash
        run: |
          python3 - <<'PY'
          import io, json, re, statistics, zipfile
          from urllib.request import Request, urlopen
          from collections import Counter,defaultdict
          import xml.etree.ElementTree as ET
          url='https://catalogue.data.gov.bc.ca/dataset/45711667-7878-4d86-8b5e-d0be5997dd16/resource/6fd8fbe1-08a7-4352-8de9-1b0c323e2fb5/download/compulsory-inspection-data-1900-to-2023-24.xlsx'
          with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0 HuntSmartDataAudit/1.0'}),timeout=35) as r:data=r.read(65000000)
          z=zipfile.ZipFile(io.BytesIO(data));shared=[]
          if 'xl/sharedStrings.xml' in z.namelist():
           with z.open('xl/sharedStrings.xml') as st:
            for _,e in ET.iterparse(st,events=('end',)):
             if e.tag.endswith('}si'):
              shared.append(''.join(n.text or '' for n in e.iter() if n.tag.endswith('}t')))
              e.clear()
          def idx(ref):
           m=re.match(r'[A-Z]+',ref or '')
           if not m:return -1
           n=0
           for c in m.group():n=n*26+ord(c)-64
           return n-1
          heads=None;year=Counter();methods=Counter();subspecies=Counter();kill=Counter();age=defaultdict(list);examples=[]
          with z.open('xl/worksheets/sheet2.xml') as st:
           for _,el in ET.iterparse(st,events=('end',)):
            if not el.tag.endswith('}row'):continue
            cells={}
            for c in el:
             if not c.tag.endswith('}c'):continue
             i=idx(c.attrib.get('r'))
             if i<0:continue
             v=next((a for a in c if a.tag.endswith('}v')),None)
             if v is None:continue
             x=v.text or ''
             if c.attrib.get('t')=='s':
              try:x=shared[int(x)]
              except (ValueError,IndexError):pass
             cells[i]=x
            if heads is None:
             heads=[cells.get(i,'') for i in range(max(cells)+1)]
            else:
             row={name:cells.get(i,'') for i,name in enumerate(heads)}
             if row.get('Species')=='SHEE':
              year[row.get('Licence Year','')]+=1
              subspecies[row.get('Sheep Sub-Species','')]+=1
              kill[row.get('WILD Kill Code','')]+=1
              entries=[]
              for field in ['Tooth - I1','Tooth - I2','Tooth - I3','Tooth PM','Wear - Staining - Eruption','Visual Inpection of Animal']:
               raw=row.get(field,'')
               if not raw:continue
               methods[field]+=1
               try:
                val=float(raw)
                if val.is_integer() and 2<=val<=20 and field!='Visual Inpection of Animal':entries.append((field,int(val)))
               except ValueError:pass
              if (row.get('WILD Kill Code','').lower() in ('hunter kill','hunter') and
                  ('ram' in row.get('Animal Class','').lower() or row.get('Animal Class','').lower()=='male') and entries and row.get('Licence Year','') in ('2022/23','2023/24','2024/25')):
               try:wmu=int(float(row.get('WMU','')))
               except ValueError:wmu=0
               if wmu>=100 and wmu%100 not in (0,99):
                age[(f'{wmu//100}-{wmu%100}',row.get('Sheep Sub-Species') or 'unspecified')].append(entries[0][1])
              if len(examples)<6:
               examples.append({k:row.get(k) for k in ['Licence Year','Sheep Sub-Species','WILD Kill Code','Animal Class','WMU','Tooth - I1','Tooth - I2','Tooth - I3','Tooth PM','Visual Inpection of Animal','Wear - Staining - Eruption']})
            el.clear()
          print('CI_AGE_YEARS',year,flush=True)
          print('CI_AGE_SPECIES',subspecies,flush=True)
          print('CI_AGE_KILLS',kill,flush=True)
          print('CI_AGE_METHODS',methods,flush=True)
          print('CI_AGE_EXAMPLES',json.dumps(examples,separators=(',',':')),flush=True)
          print('BC_SHEEP_AGE_JSON',json.dumps({'period':'2022/23–2024/25','units':{key[0]+'|'+key[1]:[len(v),round(statistics.mean(v),1),statistics.median(v),sum(a>=8 for a in v)] for key,v in sorted(age.items())}},separators=(',',':')),flush=True)
          PY
