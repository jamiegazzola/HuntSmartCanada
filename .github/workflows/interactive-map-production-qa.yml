name: HuntSmart Interactive Map Production QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - imagery-lab.js
      - imagery-lab.css
      - world-class-map.js
      - terrain-intelligence.css
      - terrain-intelligence.js
      - mobile-map-polish.css
      - mobile-map-topbar-fix.css
      - mobile-map-shell-finalizer.js
      - mobile-pwa-shell.css
      - mobile-pwa-shell.js
      - site.webmanifest
      - hs-offline-lite-sw.js
      - bc-open-seasons.js
      - maps.js
      - index.html
      - build-preview.sh
      - netlify.toml
      - species-map/**
      - netlify/functions/species-data.mjs
      - netlify/edge-functions/**
      - netlify/lib/**
      - scripts/verify-private-species.mjs
      - scripts/verify-species-map.cjs
      - scripts/patch-species-public.cjs
      - scripts/patch-species-map-coordinate-copy.cjs
      - .github/workflows/interactive-map-production-qa.yml

permissions:
  contents: read

jobs:
  production-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install QA dependencies
        run: npm ci --ignore-scripts
      - name: Verify species layer selection and fallback
        run: node scripts/verify-species-map.cjs
      - name: Verify public species map data
        run: node scripts/patch-species-public.cjs && node scripts/verify-private-species.mjs
      - name: Validate deployed map, species data, and PWA assets
        env:
          URL: https://huntsmartcanada.ca
        run: |
          node <<'NODE'
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const within=(promise,ms,label)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(`${label} timed out`)),ms))]);
          async function response(path){return within(fetch(`${process.env.URL}${path}${path.includes('?')?'&':'?'}qa=${Date.now()}`,{cache:'no-store'}),20000,`fetch ${path}`)}
          async function text(path){const r=await response(path);assert(r.ok,`${path} returned ${r.status}`);return r.text()}
          async function waitForMarker(path,marker){for(let i=0;i<18;i++){const r=await response(path);if(r.ok){const body=await r.text();if(body.includes(marker))return body}await sleep(5000)}throw new Error(`${path} never published marker ${marker}`)}
          async function waitForJson(path,validate){let last='';for(let i=0;i<18;i++){const r=await response(path);last=await r.text();if(r.ok){try{const j=JSON.parse(last);if(validate(j))return j}catch(_){}}await sleep(5000)}throw new Error(`${path} never became valid: ${last}`)}
          (async()=>{
            const html=await text('/');
            assert(html.includes('name="huntsmart-pwa-shell"'),'PWA build marker missing');
            const manifest=JSON.parse(await text('/site.webmanifest'));assert(manifest.display==='standalone','manifest display invalid');
            const sw=await text('/hs-offline-lite-sw.js');assert(sw.includes('networkFirst(request)'),'service worker update policy missing');

            const mapPage=await response('/species-map/');
            assert(mapPage.ok,`/species-map/ returned ${mapPage.status}`);
            assert(mapPage.status!==401,'species map unexpectedly requires authentication');

            const app=await waitForMarker('/species-map/app.js','const DROP_PIN_COORDINATE_COPY = true;');
            assert(app.includes("button.id = 'coordinate-drop-pin'"),'drop-pin button missing');
            assert(app.includes("toast.textContent = 'Coordinates copied'"),'coordinate-copy confirmation missing');
            assert(app.includes("map.setOptions({ mapTypeControl: false })"),'old map-type control is not disabled');
            assert(app.includes("map.addListener('click'"),'next-map-tap handler missing');
            assert(app.includes("setTimeout(() => toast.classList.remove('show'), 3000)"),'3-second toast duration missing');
            assert(!app.includes('COORDINATE_HOLD_MS'),'legacy long-press interaction still deployed');
            assert(!app.includes('map.setZoom(Math.max(map.getZoom(), 18))'),'3D toggle must not forcibly zoom to blurry satellite imagery');
            assert(!app.includes('map.setZoom(preTiltView.zoom)'),'leaving 3D must not unexpectedly restore old zoom');
            assert(app.includes('toggleTerrain3D()') && app.includes('syncTerrain3D(version)'), 'DEM-based 3D terrain toggle must remain available');
            assert(app.includes("button.id = 'fsr-toggle'"),'FSR truck toggle is missing');
            assert(app.includes("button.textContent = '🚚'"),'FSR truck emoji is missing');
            assert(app.includes("definitionExpression:'FEATURE_CLASS_SKEY = 558'"),'FSR roads filter is missing');
            assert(app.includes("color:[238,183,52,255]"),'FSR roads must render gold');
            assert(app.includes("map.overlayMapTypes.push(fsrLayer)"),'FSR map tiles toggle is missing');
            assert(app.includes("const cacheKey = 'rocky_elk_march_2005_clipped'"),'Rocky elk historical KMZ renderer missing');
            assert(app.includes("kmzOverlayUrl('kmz-elk-historic.png'"),'March 2005 Rocky elk source is not selected');
            assert(app.includes("ctx.globalCompositeOperation = 'destination-out'"),'Rocky elk Region 1/2 image mask missing');
            assert(app.includes("feature.properties?.region_id === id"),'Rocky elk region exclusion validation missing');
            assert(app.includes("if (item.type === 'roosevelt')"),'Roosevelt elk independent branch missing');
            const regionMask = JSON.parse(await text('/species-map/data/rocky-elk-excluded-regions.geojson'));
            assert(regionMask.type === 'FeatureCollection' && regionMask.features.length === 2,'Rocky elk Region 1/2 clip data missing');
            assert(['1','2'].every(id => regionMask.features.some(f=>f.properties.region_id===id && f.geometry.type==='Polygon')),'Rocky elk mask polygon ids invalid');

            const abPage=await waitForMarker('/species-map/', 'id="province-alberta"');
            assert(abPage.includes('alberta-species.js?v='), 'Alberta species catalogue not published');
            const abCatalog=await text('/species-map/alberta-species.js');
            assert(abCatalog.includes("type:'federal_boreal_range'"), 'Alberta federal range catalog missing');
            assert(app.includes('species-map-alberta-range-v13'), 'Alberta province switching JS is not deployed');
            await waitForJson('/.netlify/functions/alberta-boreal-caribou',j=>j?.type==='FeatureCollection'&&
              Array.isArray(j.features)&&j.features.length>=8&&
              j.features.every(f=>/^AB(?:[1-9]|1[0-2])$/.test(f?.properties?.CODE||'')&&
                ['Polygon','MultiPolygon'].includes(f?.geometry?.type)));

            await waitForJson('/species-map/api/species-data?kind=rooseveltEpu',j=>j?.type==='FeatureCollection'&&Array.isArray(j.features)&&j.features.length>0);
            console.log('Public species map, drop-pin coordinate copy, and data endpoint passed.');
            console.log('HuntSmart production map/PWA smoke passed.');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
