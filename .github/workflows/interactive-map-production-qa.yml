name: HuntSmart Interactive Map Production QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - imagery-lab.js
      - imagery-lab.css
      - world-class-map.js
      - terrain-intelligence.css
      - terrain-intelligence.js
      - mobile-map-polish.css
      - mobile-map-topbar-fix.css
      - mobile-map-shell-finalizer.js
      - mobile-pwa-shell.css
      - mobile-pwa-shell.js
      - site.webmanifest
      - hs-offline-lite-sw.js
      - bc-open-seasons.js
      - maps.js
      - index.html
      - build-preview.sh
      - netlify.toml
      - species-map/**
      - netlify/functions/species-data.mjs
      - .github/workflows/interactive-map-production-qa.yml

permissions:
  contents: read

jobs:
  production-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deployed map, species data, and PWA assets
        env:
          URL: https://huntsmartcanada.ca
        run: |
          node <<'NODE'
          const assert = (v,m) => { if (!v) throw new Error(m); };
          const within = (promise, ms, label) => Promise.race([
            promise,
            new Promise((_,reject)=>setTimeout(()=>reject(new Error(`${label} timed out`)),ms))
          ]);
          async function text(path) {
            const response = await within(fetch(`${process.env.URL}${path}${path.includes('?')?'&':'?'}qa=${Date.now()}`, {cache:'no-store'}), 20000, `fetch ${path}`);
            assert(response.ok, `${path} returned ${response.status}`);
            return response.text();
          }
          async function jsonAbsolute(url,label) {
            const response = await within(fetch(url, {cache:'no-store'}), 20000, label);
            assert(response.ok, `${label} returned ${response.status}`);
            const payload = await response.json();
            if (payload?.error) throw new Error(`${label}: ${payload.error.message||'upstream error'}`);
            return payload;
          }
          function densityField(features) {
            const keys=[...new Set((features||[]).flatMap(f=>Object.keys(f.properties||{})))];
            return keys.find(k=>/^Indiv_per_sqkm_2023$/i.test(k)) ||
              keys.find(k=>/2023/i.test(k)&&/(indiv|density)/i.test(k)) ||
              keys.find(k=>/(indiv.*sqkm|density)/i.test(k));
          }
          (async()=>{
            const html = await text('/');
            assert(html.includes('name="huntsmart-pwa-shell"'), 'PWA build marker missing from production HTML');
            assert(html.includes('apple-mobile-web-app-capable'), 'iOS standalone metadata missing');
            assert(html.includes('/site.webmanifest'), 'manifest link missing');

            const manifestText = await text('/site.webmanifest');
            const manifest = JSON.parse(manifestText);
            assert(manifest.display === 'standalone', `manifest display=${manifest.display}`);
            assert(manifest.scope === '/', `manifest scope=${manifest.scope}`);
            assert(String(manifest.start_url||'').startsWith('/'), 'manifest start_url invalid');

            const js = await text('/terrain-intelligence.js');
            for (const marker of [
              '__HUNTSMART_INTERACTIVE_MAP__',
              '__HUNTSMART_PWA_SHELL__',
              '__HUNTSMART_MOBILE_MAP_SHELL_FINALIZER__',
              'hs-im-shellbar',
              'gosPremiumMobileLayers',
              'normalizeShellPlacement'
            ]) assert(js.includes(marker), `production JS missing ${marker}`);

            const css = await text('/terrain-intelligence.css');
            for (const marker of ['hs-mobile-map-active','--hs-map-page-h','safe-area-inset-bottom','hs-im-shellbar']) {
              assert(css.includes(marker), `production CSS missing ${marker}`);
            }

            const sw = await text('/hs-offline-lite-sw.js');
            assert(sw.includes('huntsmart-offline-lite-v80'), 'service worker version is stale');
            assert(sw.includes('networkFirst(request)'), 'service worker app-update policy missing');
            assert(sw.includes("url.pathname.startsWith('/map-tiles/')"), 'vector-tile cache guard missing');

            const speciesHtml = await text('/species-map/');
            assert(speciesHtml.includes('app-fast.js') && speciesHtml.includes('app-b.js'), 'species viewer production bundle is incomplete');
            const speciesFast = await text('/species-map/app-fast.js');
            assert(speciesFast.includes('rooseveltObservations'), 'Roosevelt WSI fallback is missing from production');
            assert(speciesFast.includes("__SPECIES_CACHE_VERSION='v5'"), 'species overlay cache is stale');
            const speciesB = await text('/species-map/app-b.js');
            assert(speciesB.includes("ROOSEVELT_ITEM='2774803ccefc42579458b269ad190bf8'"), 'current Roosevelt EPU source is missing');
            assert(speciesB.includes('Indiv_per_sqkm_2023'), 'Roosevelt current density field support is missing');
            assert(speciesB.includes('AbortController'), 'mobile layer cancellation is missing');

            const fallback = JSON.parse(await text('/.netlify/functions/species-data?kind=rooseveltObservations&period=modern'));
            assert(fallback.type === 'FeatureCollection' && Array.isArray(fallback.features) && fallback.features.length > 0, 'Roosevelt WSI fallback has no modern observations');

            const itemBase='https://governmentofbc.maps.arcgis.com/sharing/rest/content/items/2774803ccefc42579458b269ad190bf8';
            const meta=await jsonAbsolute(`${itemBase}?f=json`,'Roosevelt EPU item metadata');
            let service=meta.url;
            if(!service){
              const itemData=await jsonAbsolute(`${itemBase}/data?f=json`,'Roosevelt EPU item data');
              service=itemData?.operationalLayers?.find(x=>x.url)?.url||itemData?.tables?.find(x=>x.url)?.url;
            }
            assert(service,'Roosevelt EPU service URL missing');
            service=service.replace(/\/$/,'');
            let layerUrl=service;
            if(!/\/(?:FeatureServer|MapServer)\/\d+$/i.test(service)){
              const info=await jsonAbsolute(`${service}?f=json`,'Roosevelt EPU service');
              const layerId=info.layers?.[0]?.id;
              assert(layerId!=null,'Roosevelt EPU layer id missing');
              layerUrl=`${service}/${layerId}`;
            }
            const params=new URLSearchParams({where:'1=1',outFields:'*',returnGeometry:'false',f:'geojson'});
            const epu=await jsonAbsolute(`${layerUrl}/query?${params}`,'Roosevelt EPU query');
            assert(Array.isArray(epu.features)&&epu.features.length>0,'Roosevelt EPU query returned no units');
            const dField=densityField(epu.features);
            assert(dField,'Roosevelt EPU density field missing');
            const featureText=f=>JSON.stringify(f.properties||{}).toLowerCase();
            const pitt=epu.features.filter(f=>featureText(f).includes('pitt'));
            const chehalis=epu.features.filter(f=>featureText(f).includes('chehalis'));
            assert(pitt.length>0,'Pitt River Roosevelt EPU missing from authoritative dataset');
            assert(chehalis.length>0,'Chehalis Roosevelt EPU missing from authoritative dataset');
            assert(pitt.some(f=>Number(f.properties?.[dField])>0),'Pitt River Roosevelt EPU has no positive density');
            assert(chehalis.some(f=>Number(f.properties?.[dField])>0),'Chehalis Roosevelt EPU has no positive density');

            console.log(`Roosevelt production QA passed: ${epu.features.length} EPU units; Pitt=${pitt.length}; Chehalis=${chehalis.length}; WSI observations=${fallback.features.length}.`);
            console.log('HuntSmart production map/PWA asset smoke passed.');
          })().catch(error=>{console.error(error.stack||error);process.exit(1);});
          NODE
