name: HuntSmart Interactive Map Production QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - imagery-lab.js
      - imagery-lab.css
      - world-class-map.js
      - terrain-intelligence.css
      - terrain-intelligence.js
      - mobile-map-polish.css
      - mobile-map-topbar-fix.css
      - mobile-map-shell-finalizer.js
      - mobile-pwa-shell.css
      - mobile-pwa-shell.js
      - site.webmanifest
      - hs-offline-lite-sw.js
      - bc-open-seasons.js
      - maps.js
      - index.html
      - build-preview.sh
      - netlify.toml
      - species-map/**
      - netlify/functions/species-data.mjs
      - .github/workflows/interactive-map-production-qa.yml

permissions:
  contents: read

jobs:
  production-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deployed map, species data, and PWA assets
        env:
          URL: https://huntsmartcanada.ca
        run: |
          node <<'NODE'
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const within=(promise,ms,label)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(`${label} timed out`)),ms))]);
          async function response(path){return within(fetch(`${process.env.URL}${path}${path.includes('?')?'&':'?'}qa=${Date.now()}`,{cache:'no-store'}),20000,`fetch ${path}`)}
          async function text(path){const r=await response(path);assert(r.ok,`${path} returned ${r.status}`);return r.text()}
          async function waitForMarker(path,marker){for(let i=0;i<18;i++){const r=await response(path);if(r.ok){const body=await r.text();if(body.includes(marker))return body}await sleep(5000)}throw new Error(`${path} never published marker ${marker}`)}
          async function waitForJson(path,validate){let last='';for(let i=0;i<18;i++){const r=await response(path);last=await r.text();if(r.ok){try{const j=JSON.parse(last);if(validate(j))return j}catch(_){}}await sleep(5000)}throw new Error(`${path} never became valid: ${last}`)}
          (async()=>{
            const html=await text('/');
            assert(html.includes('name="huntsmart-pwa-shell"'),'PWA build marker missing');
            const manifest=JSON.parse(await text('/site.webmanifest'));assert(manifest.display==='standalone','manifest display invalid');
            const sw=await text('/hs-offline-lite-sw.js');assert(sw.includes('networkFirst(request)'),'service worker update policy missing');

            const speciesHtml=await waitForMarker('/species-map/','app.js?v=rebuild-20261031-1');
            assert(!speciesHtml.includes('app-fast.js')&&!speciesHtml.includes('app-b.js'),'legacy species bundle is still referenced');
            const speciesJs=await waitForMarker('/species-map/app.js',"species-map-rebuild-v1");
            assert(speciesJs.includes("kind=rooseveltEpu"),'Roosevelt same-origin endpoint missing');
            assert(speciesJs.includes("data/mule_deer.js"),'local species raster path missing');
            assert(speciesJs.includes('AbortController'),'layer request cancellation missing');
            assert(!speciesJs.includes('DecompressionStream'),'legacy gzip runtime dependency still present');
            const mule=await text('/species-map/data/mule_deer.js');
            assert(mule.includes('SPECIES_DATA.mule_deer'),'mule deer local distribution asset missing');

            const epu=await waitForJson('/.netlify/functions/species-data?kind=rooseveltEpu',j=>j?.type==='FeatureCollection'&&Array.isArray(j.features)&&j.features.length>0&&j.densityField==='__density');
            const byName=name=>epu.features.find(f=>String(f.properties?.EPU_Unit_Name||'').toLowerCase()===name.toLowerCase());
            const pitt=byName('Pitt'),chehalis=byName('Chehalis');
            assert(pitt,'Pitt Roosevelt EPU missing');assert(chehalis,'Chehalis Roosevelt EPU missing');
            assert(Number.isFinite(Number(pitt.properties.__density)),'Pitt Roosevelt density invalid');
            assert(Number.isFinite(Number(chehalis.properties.__density)),'Chehalis Roosevelt density invalid');
            assert(Number(pitt.properties.POP_Est_2012)===50,'Pitt population estimate changed unexpectedly');
            assert(Number(chehalis.properties.POP_Est_2012)===3,'Chehalis population estimate changed unexpectedly');
            console.log(`Species-map rebuild QA passed: Roosevelt units=${epu.features.length}; Pitt=${pitt.properties.__density}; Chehalis=${chehalis.properties.__density}`);
            console.log('HuntSmart production map/PWA smoke passed.');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
