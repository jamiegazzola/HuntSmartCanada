name: HuntSmart Map Guide Production QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - how-to-use-huntsmart-map.html
      - blog-map-demo.js
      - blog-map-demo.css
      - blog-map-guide-controller.js
      - config.js
      - build-preview.sh
      - .github/workflows/map-guide-production-qa.yml

permissions:
  contents: read

env:
  MAP_GUIDE_URL: https://huntsmartcanada.ca/blog/how-to-use-huntsmart-map/

jobs:
  production-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test live map walkthrough
        shell: bash
        run: |
          mkdir -p qa-artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const url = process.env.MAP_GUIDE_URL;
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const label = mode => mode === 'leh' ? 'LEH' : 'General Open Seasons';
          const opposite = mode => mode === 'leh' ? 'gos' : 'leh';

          async function waitForPublishedController(page) {
            let state = null;
            for (let attempt = 1; attempt <= 24; attempt += 1) {
              await page.goto(`${url}?qa=${Date.now()}-${attempt}`, { waitUntil:'domcontentloaded', timeout:45000 });
              await page.waitForSelector('#hsMapDemo', { timeout:15000 });
              await page.waitForTimeout(900);
              state = await page.evaluate(() => ({
                rail: !!document.getElementById('demoGuideRail'),
                tutorialParent: document.getElementById('demoTutorial')?.parentElement?.className || '',
                controllerScript: Array.from(document.scripts).some(s => (s.src || '').includes('blog-map-guide-controller.js')),
                hasStateModel: Object.prototype.hasOwnProperty.call(document.getElementById('hsMapDemo')?.dataset || {}, 'guideStep'),
                zoneHoverHook: !!window.__HUNTSMART_MAP_GUIDE__?.__hsZoneHoverHooks
              }));
              if (state.rail && state.controllerScript && state.hasStateModel && state.zoneHoverHook) return state;
              await page.waitForTimeout(5000);
            }
            throw new Error(`Production controller did not become ready: ${JSON.stringify(state)}`);
          }

          async function chooseMoose(page) {
            await page.waitForFunction(() => document.querySelectorAll('#demoSpecies option').length > 1, null, { timeout:30000 });
            const value = await page.locator('#demoSpecies option').evaluateAll(options => {
              const moose = options.find(option => option.value && /moose/i.test(option.textContent || option.value));
              const fallback = options.find(option => option.value);
              return (moose || fallback)?.value || '';
            });
            assert(value, 'No species option was available.');
            await page.selectOption('#demoSpecies', value);
          }

          async function clickMatchingWMU(page) {
            const map = page.locator('#demoMapWrap');
            const box = await map.boundingBox();
            assert(box, 'Map did not have a clickable bounding box.');
            const xs = [0.18,0.30,0.42,0.54,0.66,0.78,0.88];
            const ys = [0.18,0.30,0.42,0.54,0.66,0.78];
            for (const y of ys) {
              for (const x of xs) {
                await page.mouse.click(box.x + box.width*x, box.y + box.height*y);
                await page.waitForTimeout(180);
                const step = await page.locator('#hsMapDemo').getAttribute('data-guide-step');
                if (step === '5') return true;
              }
            }
            return false;
          }

          async function inspectorMode(page) {
            return page.evaluate(() => {
              const text = (document.querySelector('#demoInspector .demo-inspector-head .eyebrow')?.textContent || '').toLowerCase();
              if (text.includes('limited entry')) return 'leh';
              if (text.includes('general open')) return 'gos';
              return '';
            });
          }

          async function runFlow(browser, firstMode) {
            const context = await browser.newContext({ viewport:{width:1440,height:1000}, deviceScaleFactor:1 });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));

            const published = await waitForPublishedController(page);
            assert(published.zoneHoverHook, 'LEH zone hover enhancement is not installed on the live Mapbox instance.');
            await page.waitForSelector('.mapboxgl-canvas', { timeout:30000 });
            await page.waitForTimeout(900);

            const initial = await page.evaluate(() => {
              const tutorial = document.getElementById('demoTutorial');
              const rail = document.getElementById('demoGuideRail');
              const empty = document.querySelector('#demoInspector .demo-inspector-empty');
              const emptyVisible = empty ? getComputedStyle(empty).display !== 'none' && empty.getClientRects().length > 0 : false;
              return { rail:!!rail, tutorialInside:rail?.contains(tutorial) || false, emptyVisible };
            });
            assert(initial.rail && initial.tutorialInside, 'Tutorial is not in the dedicated right rail.');
            assert(!initial.emptyVisible, 'Legacy Select a map mode panel is visible.');

            await page.locator('#demoNext').click();
            await page.waitForFunction(() => /Choose a hunting system/.test(document.getElementById('demoStepTitle')?.textContent || ''));
            await page.locator(firstMode === 'leh' ? '#demoModeLEH' : '#demoModeGOS').click();
            await page.waitForFunction(() => /Choose a species/.test(document.getElementById('demoStepTitle')?.textContent || ''));
            await chooseMoose(page);
            await page.waitForFunction(() => /Pick a highlighted WMU/.test(document.getElementById('demoStepTitle')?.textContent || ''));

            const step4 = await page.evaluate(() => ({
              staticHint: document.getElementById('demoMapWrap')?.classList.contains('demo-map-step-active'),
              genericTarget: document.getElementById('demoMapWrap')?.classList.contains('demo-target')
            }));
            assert(step4.staticHint && !step4.genericTarget, 'Step 4 is using the old flashing map target overlay.');

            assert(await clickMatchingWMU(page), `Could not select a highlighted WMU for ${label(firstMode)}.`);
            await page.waitForFunction(() => document.getElementById('hsMapDemo')?.dataset.guideStep === '5');
            await page.waitForTimeout(80);

            const firstTitle = await page.locator('#demoStepTitle').textContent();
            const firstInspector = await inspectorMode(page);
            const firstDataset = await page.locator('#hsMapDemo').getAttribute('data-guide-first-mode');
            const nextLessonText = await page.locator('#demoNext').textContent();
            assert(firstInspector === firstMode, `Inspector mode mismatch: expected ${firstMode}, got ${firstInspector}`);
            assert(firstDataset === firstMode, `Guide first-mode mismatch: expected ${firstMode}, got ${firstDataset}`);
            assert((firstTitle || '').includes(label(firstMode)), `Step 5 title contradicts ${label(firstMode)}: ${firstTitle}`);
            assert(/^Understand your /.test(firstTitle || ''), `Step 5 should teach the current system, got: ${firstTitle}`);
            assert((nextLessonText || '').includes(label(opposite(firstMode))), `Next lesson points to wrong system: ${nextLessonText}`);
            assert(!/compare/i.test(nextLessonText || ''), `Direct comparison wording returned: ${nextLessonText}`);
            await page.screenshot({ path:`qa-artifacts/${firstMode}-01-first-result.png`, fullPage:false });

            await page.locator('#demoNext').click();
            await page.waitForFunction(() => /^Now explore /.test(document.getElementById('demoStepTitle')?.textContent || ''));
            const lessonText = await page.locator('#demoStepText').textContent();
            assert(/different question/i.test(lessonText || ''), `Second-system lesson does not explain the conceptual difference: ${lessonText}`);

            const secondMode = opposite(firstMode);
            await page.locator(secondMode === 'leh' ? '#demoModeLEH' : '#demoModeGOS').click();
            await page.waitForFunction(() => document.getElementById('hsMapDemo')?.dataset.guideStep === '7', null, { timeout:30000 });
            await page.waitForTimeout(80);

            const secondTitle = await page.locator('#demoStepTitle').textContent();
            const secondInspector = await inspectorMode(page);
            assert(secondInspector === secondMode, `Second lesson inspector mismatch: expected ${secondMode}, got ${secondInspector}`);
            assert(/^Understand your /.test(secondTitle || ''), `Second result is not framed as its own lesson: ${secondTitle}`);
            assert((secondTitle || '').includes(label(secondMode)), `Second lesson title contradicts rendered result: ${secondTitle}`);
            await page.screenshot({ path:`qa-artifacts/${firstMode}-02-second-system.png`, fullPage:false });

            await context.close();
            return { firstMode, firstTitle, firstInspector, nextLessonText, secondTitle, secondInspector, errors };
          }

          (async () => {
            const browser = await chromium.launch({ headless:true });
            const results = [];
            results.push(await runFlow(browser, 'leh'));
            results.push(await runFlow(browser, 'gos'));
            fs.writeFileSync('qa-artifacts/qa-summary.json', JSON.stringify({ url, results }, null, 2));
            await browser.close();
            console.log('Map guide production QA passed for separate LEH-first and GOS-first lesson flows.');
          })().catch(error => {
            console.error(error.stack || error.message || error);
            process.exit(1);
          });
          NODE

      - name: Upload QA screenshots and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-guide-production-qa-${{ github.run_number }}
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
