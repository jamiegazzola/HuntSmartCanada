name: HuntSmart Species Map UX Production QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/species-map-ux-production-qa.yml
      - species-map/hs-map-ui.js
      - species-map/hs-map-ui.css
      - species-map/harvest-success.js
      - species-map/elk-species.js
      - scripts/patch-rocky-elk-only.cjs
      - scripts/install-alberta-species.cjs
      - scripts/install-harvest-success.cjs
      - scripts/install-huntsmart-minimal-ui.cjs

permissions:
  contents: read

jobs:
  species-map-ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify live historical default, tabs, smart years, and mobile layout
        env:
          URL: https://huntsmartcanada.ca/species-map/
        run: |
          node <<'NODE'
          const { chromium }=require('playwright');
          const assert=require('node:assert/strict');
          async function check(browser,width,height) {
            const context=await browser.newContext({
              viewport:{width,height},hasTouch:width<700,isMobile:width<700,
              serviceWorkers:'block'
            });
            const page=await context.newPage();
            const errs=[];
            page.on('pageerror',error=>errs.push(error.message));
            const navigation=await page.goto(process.env.URL+'?ux-qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            console.log('SPECIES_MAP_NAV',JSON.stringify({
              status:navigation?.status(),url:page.url(),title:await page.title(),
              foundToolbar:await page.locator('.hs-map-toolbar').count(),
              foundSpecies:await page.locator('.species-control').count(),
              pageErrors:errs.slice(0,8)
            }));
            await page.locator('.hs-map-toolbar').waitFor({state:'visible',timeout:30000});
            assert.equal(await page.locator('#era-historical').getAttribute('aria-pressed'),'true',
              'Historical must be the initial map mode');
            assert.equal(await page.locator('.hs-map-toolbar #hs-harvest-toggle').count(),1,
              'Success must be in compact toolbar');
            assert.equal(await page.getByLabel('Harvest data view').count(),0,
              'Separate survey and inspection switch must not appear');
            assert.equal(await page.locator('[data-hs-huntmode]').count(),0,
              'Separate LEH/GOS controls must not appear');
            const geometry=await page.locator('.hs-map-toolbar').evaluate(e=>{
              const r=e.getBoundingClientRect();
              return {left:r.left,right:r.right,bottom:r.bottom,width:innerWidth,height:innerHeight};
            });
            assert(geometry.left>=0&&geometry.right<=width+2,
              'Toolbar exceeds the map viewport: '+JSON.stringify(geometry));
            const initialProvince=await page.locator('.hs-province-toggle').innerText();
            assert.equal(initialProvince,'BC','Default province should be BC');
            await page.locator('.hs-province-toggle').click();
            assert.equal(await page.locator('.hs-province-toggle').innerText(),'AB',
              'Province button must switch directly to Alberta without a menu');
            assert.equal(await page.locator('#era-control').isVisible(),false,
              'Alberta must not expose unsupported BC distribution and Success tabs');
            await page.locator('.hs-province-toggle').click();
            assert.equal(await page.locator('.hs-province-toggle').innerText(),'BC',
              'Province button must switch back to British Columbia');
            assert.equal(await page.locator('#era-control').isVisible(),true,
              'BC mode tabs must return after leaving Alberta');
            await page.locator('#hs-harvest-toggle').click();
            await page.locator('#hs-year-trigger').waitFor({state:'visible',timeout:30000});
            assert.equal(await page.locator('#hs-harvest-period').inputValue(),'ten',
              'Success should default to the real ten-year preset');
            // A visible toolbar does not prove data was painted. Observe real network
            // completion and map data before changing periods.
            const harvestStatus=async()=>page.evaluate(()=>({
              detail:document.getElementById('hs-harvest-detail')?.textContent,
              selected:document.getElementById('species')?.value,
              pressed:document.getElementById('hs-harvest-toggle')?.getAttribute('aria-pressed'),
              year:document.getElementById('hs-harvest-period')?.value,
              errors:document.getElementById('error')?.textContent,
              resources:performance.getEntriesByType('resource').filter(x=>
                /harvest-history|harvest-wmu|bc-wmu-geojson/.test(x.name)).map(x=>({
                  url:x.name.split('?')[0],duration:Math.round(x.duration),
                  transferSize:x.transferSize,decodedBodySize:x.decodedBodySize})),
            }));
            await page.waitForFunction(()=>window.HUNTSMART_HARVEST_RENDER_STATE?.()?.ready,
              null,{timeout:45000}).catch(()=>{});
            const painted=await page.evaluate(()=>window.HUNTSMART_HARVEST_RENDER_STATE?.()||null);
            console.log('SUCCESS_LAYER_DIAGNOSTIC',JSON.stringify({width,painted,...await harvestStatus(),errs:errs.slice(0,10)}));
            assert(painted?.ready && painted.features===225 &&
              (await harvestStatus()).detail?.includes('WMUs with comparable'),
              'No coloured WMU harvest overlay rendered: '+JSON.stringify({painted,...await harvestStatus()}));
            await page.locator('#hs-year-trigger').click();
            await page.locator('[data-hs-period="average"]').click();
            assert.equal(await page.locator('#hs-harvest-period').inputValue(),'average',
              'Five-year preset is not selectable');
            await page.locator('[data-hs-period="all"]').click();
            assert.equal(await page.locator('#hs-harvest-period').inputValue(),'all',
              'All-years preset is not selectable');
            await page.locator('[data-hs-period="custom"]').click();
            assert.equal(await page.locator('#hs-harvest-period').inputValue(),'custom',
              'Custom preset is not selectable');
            await page.locator('#era-modern').click();
            assert.equal(await page.locator('#era-modern').getAttribute('aria-pressed'),'true',
              'Switching from success to Modern failed');
            assert.equal(await page.locator('#hs-year-trigger').isVisible(),false,
              'Year picker should hide outside Success');
            // Elk's only supported distribution era remains accessible alongside Success.
            await page.locator('#species').selectOption('elk');
            assert.equal(await page.locator('#era-control').isVisible(),true,
              'Rocky Mountain elk must not hide the toolbar containing Success');
            assert.equal(await page.locator('#era-modern').isVisible(),false,
              'Rocky Mountain elk does not have a verified modern distribution layer');
            assert.equal(await page.locator('#era-historical').isVisible(),true);
            assert.equal(await page.locator('#era-historical').getAttribute('aria-pressed'),'true');
            assert.equal(await page.locator('#hs-harvest-toggle').isVisible(),true);
            assert(await page.evaluate(()=>window.HUNTSMART_ELK_POLICY?.excludesFromSuccess('elk','1-10') &&
              window.HUNTSMART_ELK_POLICY?.excludesFromSuccess('elk','2-12')),
              'Production elk species identity must exclude Regions 1 and 2');
            await page.locator('#hs-harvest-toggle').click();
            await page.waitForFunction(()=>window.HUNTSMART_HARVEST_RENDER_STATE?.()?.ready,
              null,{timeout:45000});
            const rockyDetail=await page.locator('#hs-harvest-detail').textContent();
            assert(rockyDetail.includes('Regions 1 and 2 excluded') && rockyDetail.includes('not subspecies-specific'),
              'Rocky elk success must explain exclusions and all-elk source data');
            await page.locator('#era-historical').click();
            assert.equal(await page.locator('#hs-year-trigger').isVisible(),false);
            await page.locator('#species').selectOption('roosevelt_elk');
            assert.equal(await page.locator('#era-control').isVisible(),true,
              'Roosevelt elk must not hide the toolbar containing Success');
            assert.equal(await page.locator('#era-modern').isVisible(),true);
            assert.equal(await page.locator('#era-modern').innerText(),'Distribution');
            assert.equal(await page.locator('#era-historical').isVisible(),false);
            assert.equal(await page.locator('#hs-harvest-toggle').isVisible(),true);
            await page.locator('#hs-harvest-toggle').click();
            await page.waitForFunction(()=>window.HUNTSMART_HARVEST_RENDER_STATE?.()?.ready,
              null,{timeout:45000});
            const rooseveltDetail=await page.locator('#hs-harvest-detail').textContent();
            assert(rooseveltDetail.includes('not subspecies-specific') &&
              rooseveltDetail.includes('Coastal Regions 1 and 2 only') &&
              !rooseveltDetail.includes('Regions 1 and 2 excluded'),
              'Roosevelt must only show coastal all-elk WMUs, never the whole province');
            assert((await page.locator('#hs-metric-legend').textContent()).includes('Coastal WMUs · all elk'),
              'Subspecies limitation must be visible beside the map legend');
            await page.locator('#species').selectOption('moose');
            assert.equal(await page.locator('#era-modern').isVisible(),true);
            assert.equal(await page.locator('#era-historical').isVisible(),true);
            assert.equal(await page.locator('#era-modern').innerText(),'Modern');
            // Page-origin errors originating from Google/Mapbox can be logged independently.
            assert(!errs.some(s=>/controls missing|ReferenceError.*hs-map-ui|Cannot read properties of null.*appendChild/i.test(s)),
              'HuntSmart control runtime failed: '+errs.join(' | '));
            console.log('Species map UX passed at '+width+'px');
            await context.close();
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            await check(browser,1280,900);
            await check(browser,390,844);
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
