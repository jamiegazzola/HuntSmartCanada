name: Build BC Official WMU Harvest Snapshot
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-bc-harvest.yml
      - scripts/build-bc-harvest-snapshot.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate verified provincial source snapshot
        run: python3 scripts/build-bc-harvest-snapshot.py
      - name: Commit current pinned provincial snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add species-map/data/bc-official-harvest-wmu-2020-2024.json species-map/data/bc-official-harvest-history-1976-2024.json
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "data(species-map): pin BC government WMU harvest 2020-24"
            git push origin HEAD:main
          fi
