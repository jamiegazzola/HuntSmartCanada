name: Probe BC Official WMU Harvest CSV
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-bc-harvest.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read provincial CSV and report 2024 coverage
        run: |
          python3 - <<'PY'
          import urllib.request, csv, io, collections, hashlib
          url="https://catalogue.data.gov.bc.ca/dataset/f2303645-5952-4766-bd5c-3b9b50dda1ca/resource/ea1505f6-77ab-4838-b4a9-309ec55a3c20/download/big-game-harvest-statistics-1976-to-2024-wmu.csv"
          req=urllib.request.Request(url,headers={'User-Agent':'HuntSmartCanada/1.0 (official-data-ingest)'})
          with urllib.request.urlopen(req,timeout=35) as resp:
            raw=resp.read(18_000_000)
            print('HTTP',resp.status,'Bytes',len(raw),'SHA256',hashlib.sha256(raw).hexdigest())
          reader=csv.DictReader(io.StringIO(raw.decode('utf-8-sig')))
          print('COLUMNS',reader.fieldnames)
          rows=list(reader)
          print('ROWS',len(rows))
          last=[r for r in rows if str(r.get('HUNT YEAR','')).strip()=='2024']
          print('2024 COUNT',len(last))
          counts=collections.Counter(r.get('SPECIES','') for r in last)
          print('SPECIES',sorted(counts.items()))
          for sp in ['SHEE','DEMU','ELK','BEAB','WOLF']:
            group=[r for r in last if r.get('SPECIES')==sp]
            print('SAMPLE',sp,group[:2])
          PY
