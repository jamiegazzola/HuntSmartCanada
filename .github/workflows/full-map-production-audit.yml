name: HuntSmart Full Live Map QA
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/build-map-startup.cjs
      - scripts/full-map-production-audit.cjs
      - species-map/hs-app-nav.css
      - .github/workflows/full-map-production-audit.yml
  push:
    branches: [main]
    paths:
      - scripts/build-map-startup.cjs
      - scripts/full-map-production-audit.cjs
      - species-map/hs-app-nav.css
      - .github/workflows/full-map-production-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-live-maps:
    # PR previews validate CSS before merge. The full live audit runs only
    # after main is published, avoiding a known old-production false failure.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA browser runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Check audit syntax
        run: node --check scripts/full-map-production-audit.cjs
      - name: Wait for this production deployment
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PYTHON'
          import os, time, urllib.request
          for attempt in range(90):
              try:
                  text = urllib.request.urlopen('https://huntsmartcanada.ca/?startup-qa=' + str(time.time()), timeout=20).read().decode()
                  if 'content="' + os.environ['EXPECTED_COMMIT'] + '"' in text:
                      break
              except Exception:
                  pass
              time.sleep(10)
          else:
              raise SystemExit('Expected production commit did not deploy')
          PYTHON
      - name: Measure mobile and desktop map startup
        run: node scripts/measure-map-startup.cjs
      - name: Test live BC, Alberta, GOS, hunt-card and species maps
        env:
          URL: https://huntsmartcanada.ca
        run: node scripts/full-map-production-audit.cjs
      - name: Preserve diagnostics and browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-full-map-audit-${{ github.run_number }}
          path: map-qa-artifacts/
          retention-days: 14
          if-no-files-found: warn
