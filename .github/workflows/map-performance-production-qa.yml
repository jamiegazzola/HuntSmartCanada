name: HuntSmart Map Performance Production QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - map-performance-runtime.js
      - map-vector-runtime.js
      - build-map-performance.py
      - build-wmu-vector-tiles.py
      - hs-offline-lite-sw.js
      - netlify.toml
      - .github/workflows/map-performance-production-qa.yml

permissions:
  contents: read

jobs:
  map-performance-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate vector-tile progressive map on production
        env:
          URL: https://huntsmartcanada.ca/
          EXPECTED_VECTOR_VERSION: 2026-10-28-vector-v1
          EXPECTED_TILE_VERSION: 20261028-v2
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = (value, message) => { if (!value) throw new Error(message); };
          const expectedVector = process.env.EXPECTED_VECTOR_VERSION;
          const expectedTiles = process.env.EXPECTED_TILE_VERSION;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function waitForDeployment(browser) {
            let last = '';
            for (let i = 0; i < 40; i++) {
              const page = await browser.newPage({ viewport: { width:390, height:844 }, hasTouch:true });
              try {
                await page.goto(`${process.env.URL}?vector-deploy=${Date.now()}-${i}`, { waitUntil:'commit', timeout:30000 });
                await page.waitForFunction(v => window.__HS_WMU_VECTOR_TILES__?.version === v, expectedVector, { timeout:15000 });
                const got = await page.evaluate(() => window.__HS_WMU_VECTOR_TILES__?.version || '');
                last = got;
                await page.close();
                if (got === expectedVector) return;
              } catch (error) {
                last = error.message;
                await page.close().catch(()=>{});
              }
              await sleep(5000);
            }
            throw new Error(`Production vector-tile gate failed. Last value: ${last}`);
          }

          const isFullGeometry = url => /\/bc-wmu-geojson\.js|\/ab-wmu-geojson(?:-[123])?\.js/.test(url);
          const isVectorTile = url => url.includes(`/map-tiles/${expectedTiles}/`) && url.includes('.pbf');

          (async () => {
            const browser = await chromium.launch({ headless:true });
            await waitForDeployment(browser);
            const context = await browser.newContext({ viewport:{width:390,height:844}, hasTouch:true, serviceWorkers:'block' });
            const page = await context.newPage();
            const requests = [];
            const pageErrors = [];
            page.on('request', request => requests.push(request.url()));
            page.on('pageerror', error => pageErrors.push(error.message));

            await page.goto(`${process.env.URL}?vector-map-qa=${Date.now()}`, { waitUntil:'commit', timeout:30000 });
            await page.waitForFunction(v => window.__HS_WMU_VECTOR_TILES__?.version === v, expectedVector, { timeout:30000 });
            await page.waitForLoadState('domcontentloaded', { timeout:30000 }).catch(()=>{});
            await page.waitForTimeout(400);

            const home = await page.evaluate(() => window.__HS_WMU_VECTOR_TILES__.snapshot());
            assert(home.version === expectedVector, `Wrong vector runtime ${JSON.stringify(home)}`);
            assert(!home.manifestLoaded, `Vector manifest loaded on Home ${JSON.stringify(home)}`);
            assert(requests.filter(isVectorTile).length === 0, `Vector tiles requested before Map: ${JSON.stringify(requests.filter(isVectorTile))}`);
            assert(requests.filter(isFullGeometry).length === 0, `Full geometry requested before Map: ${JSON.stringify(requests.filter(isFullGeometry))}`);

            const bcStarted = Date.now();
            await page.evaluate(() => document.querySelector('#hsMobileTabbar [data-tab="map"]')?.click());
            await page.waitForFunction(() => {
              try {
                if (typeof fullMapInstance === 'undefined' || !fullMapInstance) return false;
                if (typeof fullMapInstance.isStyleLoaded === 'function' && !fullMapInstance.isStyleLoaded()) return false;
                const source = fullMapInstance.getStyle()?.sources?.['wmu-src'];
                return source?.type === 'vector' && window.__HS_WMU_VECTOR_TILES__?.snapshot().manifestLoaded;
              } catch (_) { return false; }
            }, null, { timeout:30000 });
            const bcInteractiveMs = Date.now() - bcStarted;
            await page.waitForTimeout(1200);

            const bcTiles = requests.filter(url => isVectorTile(url) && url.includes(`/${expectedTiles}/bc/`));
            assert(bcTiles.length > 0, `BC vector tiles were not requested: ${JSON.stringify(requests.filter(isVectorTile))}`);
            assert(requests.filter(isFullGeometry).length === 0, `BC Map fell back to full geometry: ${JSON.stringify(requests.filter(isFullGeometry))}`);
            let vectorState = await page.evaluate(() => window.__HS_WMU_VECTOR_TILES__.snapshot());
            assert(vectorState.bcFeatureCount > 100, `BC vector index is incomplete: ${JSON.stringify(vectorState)}`);
            assert(!vectorState.bcFullGeometry, 'BC full geometry should stay unloaded on the main map');

            await page.evaluate(() => fullMapSelectWMU('3-17', false));
            await page.waitForTimeout(150);
            const selection = await page.evaluate(() => ({ selected:[...fullMapSelRegions], selectedWMU:fullMapSelectedWMU }));
            assert(selection.selected.includes('3-17'), `WMU selection failed on vector source: ${JSON.stringify(selection)}`);

            const abStarted = Date.now();
            await page.evaluate(() => fullMapSetProvince('AB'));
            await page.waitForFunction(() => {
              try {
                if (typeof fullMapProvince === 'undefined' || fullMapProvince !== 'AB') return false;
                if (typeof fullMapInstance === 'undefined' || !fullMapInstance) return false;
                if (typeof fullMapInstance.isStyleLoaded === 'function' && !fullMapInstance.isStyleLoaded()) return false;
                const source = fullMapInstance.getStyle()?.sources?.['wmu-src'];
                return source?.type === 'vector';
              } catch (_) { return false; }
            }, null, { timeout:30000 });
            const abInteractiveMs = Date.now() - abStarted;
            await page.waitForTimeout(1200);

            const abTiles = requests.filter(url => isVectorTile(url) && url.includes(`/${expectedTiles}/ab/`));
            assert(abTiles.length > 0, `Alberta vector tiles were not requested: ${JSON.stringify(requests.filter(isVectorTile))}`);
            assert(requests.filter(isFullGeometry).length === 0, `Alberta Map fell back to full geometry: ${JSON.stringify(requests.filter(isFullGeometry))}`);
            vectorState = await page.evaluate(() => window.__HS_WMU_VECTOR_TILES__.snapshot());
            assert(vectorState.abFeatureCount > 100, `Alberta vector index is incomplete: ${JSON.stringify(vectorState)}`);
            assert(!vectorState.abFullGeometry, 'Alberta full geometry should stay unloaded on the main map');

            await page.evaluate(() => window.__HUNTSMART_INTERACTIVE_MAP__.open('gos', { province:'BC' }));
            await page.waitForFunction(() => {
              try {
                if (typeof osMapInstance === 'undefined' || !osMapInstance) return false;
                if (typeof osMapInstance.isStyleLoaded === 'function' && !osMapInstance.isStyleLoaded()) return false;
                const source = osMapInstance.getStyle()?.sources?.['os-wmu-src'];
                return source?.type === 'vector';
              } catch (_) { return false; }
            }, null, { timeout:30000 });
            await page.waitForTimeout(500);
            assert(requests.filter(isFullGeometry).length === 0, `GOS loaded full WMU geometry: ${JSON.stringify(requests.filter(isFullGeometry))}`);
            assert(!pageErrors.length, `Page errors: ${pageErrors.join(' | ')}`);

            const perf = await page.evaluate(() => ({ vector:window.__HS_WMU_VECTOR_TILES__.snapshot(), phase1:window.__HS_MAP_PERFORMANCE__?.snapshot?.() || null }));
            console.log('MAP_VECTOR_METRICS', JSON.stringify({ bcInteractiveMs, abInteractiveMs, bcTileRequests:bcTiles.length, abTileRequests:abTiles.length, perf }));
            console.log('HuntSmart vector map QA passed: Home stays geometry-free, BC/AB stream MVT tiles, and GOS shares the vector source architecture.');
            await context.close();
            await browser.close();
          })().catch(error => { console.error(error.stack || error); process.exit(1); });
          NODE
