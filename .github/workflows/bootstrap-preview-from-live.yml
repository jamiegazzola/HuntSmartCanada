name: Bootstrap preview from live HuntSmart

on:
  push:
    branches:
      - preview/live-production-github
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-live-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/live-production-github
          fetch-depth: 0

      - name: Download exact live runtime files
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://huntsmartcanada.netlify.app"
          FILES=(
            "index.html"
            "style.css"
            "homepage-polish.css"
            "auth-styles.css"
            "stripe-styles.css"
            "auth.js"
            "stripe.js"
            "hunting-partners.js"
            "config.js"
            "data.js"
            "cities.js"
            "drive-times.js"
            "drive-time.js"
            "bc-draws.js"
            "bc-detail.js"
            "bc-filters.js"
            "bc-saved-compare.js"
            "ab-draws.js"
            "ab-cards.js"
            "ab-filters.js"
            "ui.js"
            "ab-wmu-geojson-1.js"
            "ab-wmu-geojson-2.js"
            "ab-wmu-geojson-3.js"
            "ab-wmu-geojson.js"
            "bc-wmu-geojson.js"
            "bc-region-geojson.js"
            "bc-open-seasons.js"
            "maps.js"
            "card-map-3d-fullscreen-fix.js"
            "homepage-polish.js"
            "sync.js"
            "draws.json"
            "writeups.json"
            "leh_zones.json"
            "historical_wildfires_simplified_50m.geojson"
            "2024-2026 hunting synopsis.pdf"
            "hs-offline-lite-sw.js"
            "images/hero-bg.jpg"
            "images/filter-bg.jpg"
            "images/logo.png"
          )

          for file in "${FILES[@]}"; do
            mkdir -p "$(dirname "$file")"
            encoded="${file// /%20}"
            echo "Fetching $file"
            curl -fL --retry 3 --retry-delay 2 "$BASE/$encoded" -o "$file"
          done

      - name: Commit live snapshot to preview branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            index.html style.css homepage-polish.css auth-styles.css stripe-styles.css \
            auth.js stripe.js hunting-partners.js config.js data.js cities.js drive-times.js drive-time.js \
            bc-draws.js bc-detail.js bc-filters.js bc-saved-compare.js \
            ab-draws.js ab-cards.js ab-filters.js ui.js \
            ab-wmu-geojson-1.js ab-wmu-geojson-2.js ab-wmu-geojson-3.js ab-wmu-geojson.js \
            bc-wmu-geojson.js bc-region-geojson.js bc-open-seasons.js maps.js card-map-3d-fullscreen-fix.js \
            homepage-polish.js sync.js draws.json writeups.json leh_zones.json \
            historical_wildfires_simplified_50m.geojson "2024-2026 hunting synopsis.pdf" hs-offline-lite-sw.js images/
          if git diff --cached --quiet; then
            echo "Preview branch already matches the live runtime."
            exit 0
          fi
          git commit -m "[sync-live] Snapshot current manual Netlify production runtime"
          git push origin HEAD:preview/live-production-github
