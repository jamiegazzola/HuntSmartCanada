name: Build fixed BC big-game KMZ

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-bc-kmz-fixed.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests shapely pillow
      - name: Build offline KMZ
        shell: bash
        run: |
          cat > /tmp/build_kmz.py <<'PY'
          import json, html, zipfile, time
          from pathlib import Path
          import requests
          from shapely.geometry import shape, mapping
          from shapely.validation import make_valid
          from PIL import Image, ImageDraw

          OUT=Path('BC_Big_Game_Abundance_Offline_Fixed_2026_v7.kml')
          KMZ=Path('BC_Big_Game_Abundance_Offline_Fixed_2026_v7.kmz')
          PNG=Path('BC_UWR_Approved_2026.png')
          REPORT=Path('BC_Big_Game_Abundance_Offline_Fixed_2026_v7_validation.txt')
          NS='http://www.opengis.net/kml/2.2'
          session=requests.Session(); session.headers.update({'User-Agent':'HuntSmart-BC-GIS-Builder/1.0'})
          BC=(-139.2,48.1,-113.8,60.1) # west,south,east,north

          def esc(v): return html.escape(str(v),quote=True)
          def request_page(layer,start,count=5000,retries=4):
              u=f'https://openmaps.gov.bc.ca/geo/pub/{layer}/ows'
              p={'service':'WFS','version':'2.0.0','request':'GetFeature','typeNames':'pub:'+layer,'outputFormat':'application/json','srsName':'EPSG:4326','count':count,'startIndex':start}
              last=None
              for i in range(retries):
                  try:
                      r=session.get(u,params=p,timeout=120); r.raise_for_status(); return r.json()
                  except Exception as e:
                      last=e; time.sleep(1.5*(i+1))
              raise last
          def fetch_all(layer):
              feats=[]; start=0
              while True:
                  data=request_page(layer,start); batch=data.get('features',[]); feats.extend(batch)
                  if len(batch)<5000: break
                  start+=len(batch)
                  if start>1000000: raise RuntimeError('WFS paging safety limit exceeded')
              return {'type':'FeatureCollection','features':feats}
          def load_wmu():
              t=Path('bc-wmu-geojson.js').read_text(errors='ignore'); a=t.find('{'); b=t.rfind('}')
              return json.loads(t[a:b+1])
          def geom_kml(geom,simplify=0):
              try:
                  g=shape(geom)
                  if not g.is_valid:g=make_valid(g)
                  if simplify:g=g.simplify(simplify,preserve_topology=True)
              except:return ''
              def ring(c):return ' '.join(f'{x:.6f},{y:.6f},0' for x,y,*_ in c)
              def poly(p):
                  s='<Polygon><tessellate>1</tessellate><outerBoundaryIs><LinearRing><coordinates>'+ring(p.exterior.coords)+'</coordinates></LinearRing></outerBoundaryIs>'
                  for i in p.interiors:s+='<innerBoundaryIs><LinearRing><coordinates>'+ring(i.coords)+'</coordinates></LinearRing></innerBoundaryIs>'
                  return s+'</Polygon>'
              if g.geom_type=='Polygon':return poly(g)
              if g.geom_type=='MultiPolygon':return '<MultiGeometry>'+''.join(poly(p) for p in g.geoms)+'</MultiGeometry>'
              if g.geom_type=='GeometryCollection':return '<MultiGeometry>'+''.join(geom_kml(mapping(x),0) for x in g.geoms)+'</MultiGeometry>'
              return ''
          def pick(p,keys):
              for k in keys:
                  if p.get(k) not in (None,''):return p[k]
              return ''
          def folder(name,fc,style,labels,desc,simp):
              out=[f'<Folder><name>{esc(name)}</name><visibility>0</visibility>']; n=0
              for f in fc.get('features',[]):
                  g=geom_kml(f.get('geometry'),simp) if f.get('geometry') else ''
                  if not g:continue
                  p=f.get('properties') or {}; nm=pick(p,labels) or f'{name} {n+1}'
                  rows=''.join(f'<tr><td><b>{esc(k)}</b></td><td>{esc(p[k])}</td></tr>' for k in desc if p.get(k) not in (None,''))
                  out.append(f'<Placemark><name>{esc(nm)}</name><styleUrl>#{style}</styleUrl><description><![CDATA[<table>{rows}</table>]]></description>{g}</Placemark>'); n+=1
              out.append('</Folder>'); return ''.join(out),n
          # Full approved UWR dataset -> one embedded raster overlay for Google Earth performance.
          west,south,east,north=BC; W=6500; H=round(W*(north-south)/(east-west)); img=Image.new('RGBA',(W,H),(0,0,0,0)); draw=ImageDraw.Draw(img,'RGBA')
          uwr_layer='WHSE_WILDLIFE_MANAGEMENT.WCP_UNGULATE_WINTER_RANGE_SP'; start=0; uwr_features=0; uwr_polygons=0
          def px(coords):return [((x-west)/(east-west)*(W-1),(north-y)/(north-south)*(H-1)) for x,y,*_ in coords]
          while True:
              data=request_page(uwr_layer,start); batch=data.get('features',[])
              for f in batch:
                  try:g=shape(f['geometry'])
                  except:continue
                  parts=list(g.geoms) if g.geom_type=='MultiPolygon' else [g] if g.geom_type=='Polygon' else []
                  for p in parts:
                      q=px(p.exterior.coords)
                      if len(q)>=3:draw.polygon(q,fill=(255,165,0,74),outline=(255,165,0,105)); uwr_polygons+=1
                  uwr_features+=1
              if len(batch)<5000:break
              start+=len(batch)
              if start>1000000:raise RuntimeError('UWR paging safety limit exceeded')
          img.save(PNG,optimize=True)
          uwr=f'''<Folder><name>Approved Ungulate Winter Range</name><visibility>0</visibility><description><![CDATA[Official BC Approved Ungulate Winter Range. Rasterized and embedded for fast, reliable Google Earth display.]]></description><GroundOverlay><name>Approved UWR — performance overlay</name><visibility>1</visibility><Icon><href>files/BC_UWR_Approved_2026.png</href></Icon><LatLonBox><north>{north}</north><south>{south}</south><east>{east}</east><west>{west}</west></LatLonBox></GroundOverlay></Folder>'''

          layers={'Wildlife Management Units':load_wmu()}
          for name,layer in {
            'Wild Mountain Sheep Distribution':'WHSE_WILDLIFE_MANAGEMENT.WLD_WILD_MTN_SHEEP_DISTRIB_SP',
            'Current Caribou Herd Boundaries':'WHSE_WILDLIFE_INVENTORY.GCPB_CARIBOU_POPULATION_SP',
            'Grizzly Bear Population Units':'WHSE_WILDLIFE_INVENTORY.GCPB_GRIZZLY_BEAR_POP_UNITS_SP'}.items(): layers[name]=fetch_all(layer)

          styles='''<Style id="wmu"><LineStyle><color>ccffffff</color><width>1.2</width></LineStyle><PolyStyle><color>08000000</color></PolyStyle></Style><Style id="sheep"><LineStyle><color>aa00ffff</color><width>1.2</width></LineStyle><PolyStyle><color>4400ffff</color></PolyStyle></Style><Style id="caribou"><LineStyle><color>aaff9900</color><width>1.2</width></LineStyle><PolyStyle><color>44ff9900</color></PolyStyle></Style><Style id="grizzly"><LineStyle><color>aa3333cc</color><width>1.2</width></LineStyle><PolyStyle><color>443333cc</color></PolyStyle></Style>'''
          parts=[f'<?xml version="1.0" encoding="UTF-8"?><kml xmlns="{NS}"><Document><name>BC Big Game Abundance — Offline Fixed 2026 v7</name><description><![CDATA[Self-contained Google Earth build. No live NetworkLinks. Current official BC wildlife geometry is embedded locally; UWR is rasterized for performance.]]></description>',styles]
          counts={}
          x,c=folder('Wildlife Management Units',layers['Wildlife Management Units'],'wmu',['WILDLIFE_MGMT_UNIT_ID','WMU','UNIT','NAME'],['WILDLIFE_MGMT_UNIT_ID','REGION','NAME'],.0015);parts.append(x);counts['WMU']=c
          parts.append(uwr)
          for n,st,lab,ds,si in [
            ('Wild Mountain Sheep Distribution','sheep',['HERD_NAME','POPULATION_NAME','SPECIES','SHEEP_SPECIES'],['HERD_NAME','SPECIES','SHEEP_SPECIES','ECOTYPE'],.0008),
            ('Current Caribou Herd Boundaries','caribou',['HERD_NAME','POPULATION_NAME','CARIBOU_HERD_NAME'],['HERD_NAME','POPULATION_NAME','ECOTYPE','STATUS'],.001),
            ('Grizzly Bear Population Units','grizzly',['GBPU_NAME','POPULATION_UNIT_NAME','NAME'],['GBPU_NAME','YEAR','CONSERVATION_CONCERN_RANK','STATUS'],.001)]:
              x,c=folder(n,layers[n],st,lab,ds,si);parts.append(x);counts[n]=c
          parts.append('</Document></kml>'); OUT.write_text(''.join(parts),encoding='utf-8')
          with zipfile.ZipFile(KMZ,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:z.write(OUT,'doc.kml');z.write(PNG,'files/BC_UWR_Approved_2026.png')

          import xml.etree.ElementTree as ET
          ET.parse(OUT); txt=OUT.read_text()
          assert '<NetworkLink' not in txt and '<href>http' not in txt.lower()
          with zipfile.ZipFile(KMZ) as z:assert z.testzip() is None and 'doc.kml' in z.namelist() and 'files/BC_UWR_Approved_2026.png' in z.namelist()
          r=['BC Big Game Offline Fixed 2026 v7','',f'Full UWR features fetched: {uwr_features}',f'UWR polygon parts rasterized: {uwr_polygons}',f'UWR raster: {W} x {H}',f'KML bytes: {OUT.stat().st_size}',f'PNG bytes: {PNG.stat().st_size}',f'KMZ bytes: {KMZ.stat().st_size}','NetworkLinks: 0','Remote HTTP hrefs: 0','XML parse: PASS','ZIP integrity: PASS','']+[f'{k}: {v} placemarks' for k,v in counts.items()]
          REPORT.write_text('\n'.join(r)); print(REPORT.read_text())
          PY
          python /tmp/build_kmz.py
      - uses: actions/upload-artifact@v4
        with:
          name: BC-Big-Game-Offline-Fixed-2026-v7
          path: |
            BC_Big_Game_Abundance_Offline_Fixed_2026_v7.kmz
            BC_Big_Game_Abundance_Offline_Fixed_2026_v7.kml
            BC_Big_Game_Abundance_Offline_Fixed_2026_v7_validation.txt
          if-no-files-found: error
          retention-days: 7
